[package]
name = "meow_crypto_rs"
version = "1.0.0"
edition = "2021"
authors = ["Meow Decoder Team"]
description = "Rust crypto backend for Meow Decoder - constant-time, side-channel resistant"
license = "CC-BY-NC-SA-4.0"
readme = "README.md"

[lib]
name = "meow_crypto_rs"
crate-type = ["cdylib", "lib"]

[dependencies]
# Verified crypto primitives (local crate with Verus proofs)
crypto_core = { path = "../crypto_core" }

# PyO3 for Python bindings (upgrade to address RUSTSEC-2026-0013)
# Made optional so cargo-tarpaulin can run without Python linking
pyo3 = { version = "0.28.2", features = ["extension-module"], optional = true }

# Core cryptography - all audited, production-ready crates
argon2 = "0.5"   # Argon2id KDF (password hashing)
aes-gcm = "0.10" # AES-256-GCM AEAD encryption
aes = "0.8"      # AES block cipher (for CTR mode)
ctr = "0.9"      # CTR mode for streaming encryption
cipher = "0.5"   # Cipher traits
hkdf = "0.12"    # HKDF key derivation (RFC 5869)
hmac = "0.13"    # HMAC-SHA256 authentication
sha2 = "0.10"    # SHA-256/SHA-512 hashing

# X25519 key exchange
x25519-dalek = { version = "2.0", features = ["static_secrets"] }

# Side-channel resistance
subtle = "2.5"                                       # Constant-time operations
zeroize = { version = "1.8", features = ["derive"] }

# Random number generation
rand = "0.8"
rand_core = "0.6"
getrandom = { version = "0.2", features = ["std"] }

# Handle registry
lazy_static = "1.4"

# Post-quantum (optional - requires C compiler, not available on all platforms)
pqcrypto-mlkem = { version = "0.1.1", optional = true }
pqcrypto-traits = { version = "0.3.5", optional = true }

# Serialization
hex = "0.4"

[dev-dependencies]
criterion = "0.5"
proptest = "1.11"

[features]
default = []
python = ["pyo3"] # Enable Python bindings (required for maturin build)
pq = ["pqcrypto-mlkem", "pqcrypto-traits"] # Enable post-quantum crypto
pq-signing = [
    "crypto_core/pq-crypto",
] # Enable ML-DSA-65 signing via crypto_core
yubikey = ["crypto_core/yubikey", "crypto_core/pure-crypto"]
python-tests = ["python"] # Enable tests that require Python bindings

# ─── Panic hardening ─────────────────────────────────────────────────────────
# ANY panic in a cryptographic code path is a bug; in release builds a panic
# becomes an immediate OS-level abort (no stack unwinding, no partial state).
# This prevents an attacker from using panic payloads as an oracle.
#
# In fuzz builds (rust_crypto/fuzz/) the same setting is inherited so that
# libFuzzer treats any abort as a crash finding.
#
# For Miri / sanitiser runs use:
#   RUSTFLAGS="-Z sanitizer=address" cargo +nightly test
#   RUSTFLAGS="-Z sanitizer=memory"  cargo +nightly test
#   cargo +nightly miri test

[profile.release]
lto = true        # Enable link-time optimisation (dead code removal + inlining)
codegen-units = 1 # Single codegen unit for best optimisation and LTO
opt-level = 3
panic = "abort"   # HARD REQUIREMENT: panic = FAIL (no unwinding oracle)
strip = "none"    # Keep symbols for sanitiser stack traces

[profile.dev]
panic = "abort" # Mirror release behaviour in dev builds

# Dedicated profile for sanitiser runs (address, memory, thread, UB).
# Usage: cargo test --profile sanitizer
[profile.sanitizer]
inherits = "dev"
opt-level = 1    # Minimal optimisation for readable sanitiser reports
debug = true
panic = "abort"

# ─── Proptest configuration ───────────────────────────────────────────────────
# Increase default case count for crypto property tests.
# Set PROPTEST_CASES env var to override at runtime.
# Placed here so all workspace members inherit the limit.
[package.metadata.proptest]
cases = 1024
