# Codecov configuration for Meow Decoder
# Focus on security-critical core modules (Tier 1)

codecov:
  require_ci_to_pass: yes
  notify:
    wait_for_ci: yes

coverage:
  status:
    project:
      default:
        target: auto
        threshold: 1%
        if_ci_failed: error
        # Focus on Tier 1 security-critical modules
        paths:
          - "meow_decoder/crypto.py"
          - "meow_decoder/crypto_backend.py"
          - "meow_decoder/constant_time.py"
          - "meow_decoder/x25519_forward_secrecy.py"
          - "meow_decoder/forward_secrecy.py"
          - "meow_decoder/fountain.py"
          - "meow_decoder/encode.py"
          - "meow_decoder/decode_gif.py"
          - "meow_decoder/gif_handler.py"
          - "meow_decoder/frame_mac.py"
          - "meow_decoder/schrodinger_encode.py"
          - "meow_decoder/schrodinger_decode.py"
          - "meow_decoder/quantum_mixer.py"
          - "meow_decoder/stego_advanced.py"
          - "meow_decoder/decoy_generator.py"
          - "meow_decoder/duress_mode.py"
          - "meow_decoder/timelock_duress.py"
          - "meow_decoder/secure_cleanup.py"
          - "meow_decoder/secure_bridge.py"
          - "meow_decoder/high_security.py"
          - "meow_decoder/streaming_crypto.py"
          - "meow_decoder/double_ratchet.py"
          - "meow_decoder/multi_secret.py"
          - "meow_decoder/resume_secured.py"
    patch:
      default:
        target: auto
        threshold: 1%
        # Same list for PR patch coverage
        paths:
          - "meow_decoder/crypto.py"
          - "meow_decoder/crypto_backend.py"
          - "meow_decoder/constant_time.py"
          - "meow_decoder/x25519_forward_secrecy.py"
          - "meow_decoder/forward_secrecy.py"
          - "meow_decoder/fountain.py"
          - "meow_decoder/encode.py"
          - "meow_decoder/decode_gif.py"
          - "meow_decoder/gif_handler.py"
          - "meow_decoder/frame_mac.py"
          - "meow_decoder/schrodinger_encode.py"
          - "meow_decoder/schrodinger_decode.py"
          - "meow_decoder/quantum_mixer.py"
          - "meow_decoder/stego_advanced.py"
          - "meow_decoder/decoy_generator.py"
          - "meow_decoder/duress_mode.py"
          - "meow_decoder/timelock_duress.py"
          - "meow_decoder/secure_cleanup.py"
          - "meow_decoder/secure_bridge.py"
          - "meow_decoder/high_security.py"
          - "meow_decoder/streaming_crypto.py"
          - "meow_decoder/double_ratchet.py"
          - "meow_decoder/multi_secret.py"
          - "meow_decoder/resume_secured.py"

  precision: 2
  round: down
  range: 50..100

  # Ignore non-critical paths and external resources
  ignore:
    - "tests/*"
    - "examples/*"
    - "docs/*"
    - "scripts/*"
    - "assets/*"
    - "formal/*"
    - "mobile/*"
    - "crypto_core/*"  # Rust side has separate coverage
    - "*.md"
    - ".github/*"
    - "meow_decoder/*_DEBUG.py"  # Debug modules
    - "meow_decoder/gui_*.py"  # GUI modules (Tier 3)
    - "meow_decoder/meow_dashboard*.py"  # Dashboard (Tier 3)
    - "meow_decoder/hardware_*.py"  # Hardware (Tier 3)
    - "meow_decoder/pq_*.py"  # Post-quantum (experimental)
    - "meow_decoder/prowling_mode.py"  # Experimental
    - "meow_decoder/clowder_*.py"  # Multi-device (Tier 3)
    - "meow_decoder/bidirectional.py"  # Tier 3
    - "meow_decoder/webcam_*.py"  # Webcam (Tier 3)
    - "meow_decoder/logo_eyes.py"  # Cosmetic (Tier 3)
    - "meow_decoder/ascii_qr.py"  # Cosmetic
    - "meow_decoder/ninja_cat_ultra.py"  # Tier 3
    - "meow_decoder/deadmans_switch_cli.py"  # Tier 3
    - "meow_decoder/profiling_improved.py"  # Profiling
    - "meow_decoder/meow_encode.py"  # Alternative encoder
    - "meow_decoder/setup.py"  # Installation

comment:
  layout: "reach,diff,flags,tree,footer"
  behavior: default
  require_changes: false
  require_base: no
  require_head: yes
