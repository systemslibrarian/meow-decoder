# Codecov configuration for Meow Decoder
# Monitors Rust crypto coverage (crypto_core + rust_crypto)
# Python coverage is local-only (pytest-cov / .coveragerc)

codecov:
  require_ci_to_pass: yes
  notify:
    wait_for_ci: yes

coverage:
  status:
    project:
      default:
        target: auto
        threshold: 2%
        if_ci_failed: error
        # Rust crypto source files only
        paths:
          - "crypto_core/src/"
          - "rust_crypto/src/"
    patch:
      default:
        target: auto
        threshold: 2%
        paths:
          - "crypto_core/src/"
          - "rust_crypto/src/"

  precision: 2
  round: down
  range: 50..100

flags:
  rust:
    paths:
      - crypto_core/src/
      - rust_crypto/src/
    carryforward: true

# Ignore everything except Rust crypto source
ignore:
  # Python
  - "meow_decoder/"
  - "tests/"
  - "examples/"
  - "docs/"
  - "scripts/"
  - "assets/"
  - "formal/"
  - "mobile/"
  - "fuzz/"
  - "web_demo/"
  - "htmlcov/"
  # Rust non-source
  - "crypto_core/benches/"
  - "crypto_core/tests/"
  - "crypto_core/htmlcov/"
  - "rust_crypto/tests/"
  - "rust_crypto/benches/"
  - "rust_crypto/fuzz/"
  - "target/"
  # Misc
  - "*.md"
  - "*.py"
  - "*.js"
  - "*.html"
  - ".github/"

comment:
  layout: "reach,diff,flags,tree,footer"
  behavior: default
  require_changes: false
  require_base: no
  require_head: yes
