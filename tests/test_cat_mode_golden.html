<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cat Mode Golden Video Test</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 1200px;
            margin: 50px auto;
            padding: 20px;
            background: #1a1a2e;
            color: #eee;
        }
        h1 { color: #00ff88; }
        h2 { color: #00ccff; }
        .test-case {
            background: #16213e;
            padding: 20px;
            border-radius: 8px;
            margin-bottom: 20px;
        }
        .status {
            padding: 15px;
            border-radius: 8px;
            margin: 10px 0;
            font-family: monospace;
            font-size: 14px;
        }
        .status.pass {
            background: rgba(0, 255, 136, 0.2);
            border-left: 4px solid #00ff88;
        }
        .status.fail {
            background: rgba(255, 68, 68, 0.2);
            border-left: 4px solid #ff4444;
        }
        .status.pending {
            background: rgba(255, 200, 0, 0.2);
            border-left: 4px solid #ffc800;
        }
        button {
            background: linear-gradient(135deg, #00ff88 0%, #00ccff 100%);
            color: #000;
            border: none;
            padding: 12px 24px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            margin: 5px;
        }
        button:hover { opacity: 0.8; }
        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        video {
            max-width: 100%;
            border: 2px solid #00ccff;
            border-radius: 8px;
            margin: 10px 0;
        }
        canvas {
            display: none;
        }
        .metrics {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            margin: 15px 0;
        }
        .metric {
            background: #1a1a2e;
            padding: 10px;
            border-radius: 6px;
            text-align: center;
        }
        .metric-label {
            color: #888;
            font-size: 12px;
        }
        .metric-value {
            color: #00ff88;
            font-size: 20px;
            font-weight: bold;
        }
        .test-results {
            margin-top: 30px;
        }
        .assertion {
            padding: 8px 12px;
            margin: 5px 0;
            border-radius: 4px;
            font-family: monospace;
        }
        .assertion.pass {
            background: rgba(0, 255, 136, 0.1);
            color: #00ff88;
        }
        .assertion.fail {
            background: rgba(255, 68, 68, 0.1);
            color: #ff4444;
        }
    </style>
</head>
<body>
    <h1>🧪 Cat Mode Golden Video Test Suite</h1>
    
    <div class="test-case">
        <h2>Test Case: Empty String SHA-256 Hash</h2>
        
        <video id="testVideo" controls>
            <source src="golden/cat_mode_golden_empty_hash_100ms.webm" type="video/webm">
            Your browser does not support the video tag.
        </video>
        
        <canvas id="canvas"></canvas>
        
        <button onclick="runTest()" id="runBtn">▶️ Run Test</button>
        <button onclick="runAllTests()" id="runAllBtn">▶️▶️ Run All Tests</button>
        
        <div class="metrics">
            <div class="metric">
                <div class="metric-label">Frames Processed</div>
                <div class="metric-value" id="framesProcessed">0</div>
            </div>
            <div class="metric">
                <div class="metric-label">Transitions</div>
                <div class="metric-value" id="transitions">0</div>
            </div>
            <div class="metric">
                <div class="metric-label">CRC Pass Rate</div>
                <div class="metric-value" id="crcRate">0%</div>
            </div>
            <div class="metric">
                <div class="metric-label">Bits Recovered</div>
                <div class="metric-value" id="bitsRecovered">0</div>
            </div>
            <div class="metric">
                <div class="metric-label">Confidence</div>
                <div class="metric-value" id="confidence">0%</div>
            </div>
            <div class="metric">
                <div class="metric-label">Session Locked</div>
                <div class="metric-value" id="session">None</div>
            </div>
        </div>
        
        <div class="status pending" id="status">
            ⏳ Ready to run test. Click "Run Test" to validate golden video.
        </div>
    </div>
    
    <div class="test-results" id="results" style="display:none;">
        <h2>📊 Test Assertions</h2>
        <div id="assertionsList"></div>
    </div>
    
    <script src="../web_demo/cat-mode-protocol.js"></script>
    <script src="../web_demo/preamble-calibration.js"></script>
    <script src="../web_demo/nrz-decoder.js"></script>
    <script src="../web_demo/quality-metrics.js"></script>
    <script src="../web_demo/adaptive-threshold.js"></script>
    <script src="../web_demo/hysteresis.js"></script>
    
    <script>
        // ====================================================================
        // Expected Test Results
        // ====================================================================
        
        const GOLDEN_TESTS = {
            empty_hash: {
                file: 'golden/cat_mode_golden_empty_hash_100ms.webm',
                expectedPayload: 'e3b0c44298fc1c149afbf4c8996fb92427ae41e4649b934ca495991b7852b855',
                payloadType: 'hash',
                expectedBits: 256,
                expectedSessionId: 0x12345678,
                minCrcPassRate: 90.0,
                minConfidence: 80.0
            },
            short: {
                file: 'golden/cat_mode_golden_short_150ms.webm',
                expectedPayload: '0123456789abcdef0123456789abcdef',
                payloadType: 'hex',
                expectedBits: 128,
                expectedSessionId: 0x12345678,
                minCrcPassRate: 90.0,
                minConfidence: 80.0
            },
            long: {
                file: 'golden/cat_mode_golden_long_50ms.webm',
                expectedPayload: 'The quick brown fox jumps over the lazy dog. Pack my box with five dozen liquor jugs!',
                payloadType: 'text',
                expectedBits: null, // Variable length
                expectedSessionId: 0x12345678,
                minCrcPassRate: 85.0,
                minConfidence: 75.0
            }
        };
        
        // ====================================================================
        // Video Frame Extraction
        // ====================================================================
        
        async function extractFrames(video, canvas) {
            // FIX (2026-05-04, Gate 2): the prior `video.currentTime = X;
            // await onseeked` pattern is flaky in headless Chromium —
            // `seeked` can fire before the new frame has actually been
            // composited, so getImageData reads stale frame buffers and
            // the histogram collapses to the dominant (off-state) value.
            //
            // New extraction:
            //   1. `requestVideoFrameCallback` when available (Chrome 83+,
            //      Firefox 130+, Safari 15.4+) — fires exactly when a new
            //      frame is presented for compositing.
            //   2. Fallback: play the video at natural speed and sample
            //      via rAF, indexing samples by `video.currentTime` so
            //      timing remains spec-correct under load.
            //
            // `willReadFrequently: true` on getContext silences the
            // Canvas2D readback warning and lets Chromium use a software
            // backing store optimized for `getImageData`.
            const ctx = canvas.getContext('2d', { willReadFrequently: true });
            canvas.width = video.videoWidth;
            canvas.height = video.videoHeight;

            const frames = [];
            const cx = canvas.width / 2;
            const cy = canvas.height / 2;
            const roiSize = Math.min(canvas.width, canvas.height) * 0.3;

            // FIX (2026-05-04, Gate 2): frame.time is in SECONDS, not ms.
            // Production decoder (wasm_browser_example_FULL.html:5602)
            // stores `time: targetTime` where targetTime = i * sampleInterval
            // and sampleInterval is in seconds. PreambleCalibration's
            // `minDuration = 0.8` constant, AdaptiveThreshold.update,
            // AdaptiveHysteresis, and decodeNRZ all assume seconds.
            // Storing ms here made bitRate come out 1000× too large
            // (e.g. 100 instead of 0.1), driving sampleBits to NaN math.
            function sampleFrame(timeSec) {
                ctx.drawImage(video, 0, 0);
                const imageData = ctx.getImageData(
                    cx - roiSize / 2, cy - roiSize / 2, roiSize, roiSize
                );
                frames.push({ time: timeSec, greenScore: calculateGreenScore(imageData) });
            }

            const useVFC = typeof video.requestVideoFrameCallback === 'function';

            if (useVFC) {
                // Per-frame callback: fires once per presented compositor frame.
                await new Promise((resolve, reject) => {
                    let cancelled = false;
                    const tick = (now, metadata) => {
                        if (cancelled) return;
                        sampleFrame(metadata.mediaTime);
                        if (frames.length % 10 === 0) {
                            document.getElementById('framesProcessed').textContent = frames.length;
                        }
                        if (video.ended || video.currentTime >= video.duration - 0.05) {
                            cancelled = true;
                            resolve();
                            return;
                        }
                        video.requestVideoFrameCallback(tick);
                    };
                    video.muted = true;
                    video.requestVideoFrameCallback(tick);
                    video.play().catch(reject);
                    // Safety timeout: 60s max for any video (golden videos
                    // are 30-50s real-time).
                    setTimeout(() => { if (!cancelled) { cancelled = true; resolve(); } }, 90000);
                });
            } else {
                // Fallback for older browsers: rAF + currentTime indexing.
                await new Promise((resolve, reject) => {
                    let lastSampledTime = -1;
                    const tick = () => {
                        if (video.ended || video.currentTime >= video.duration - 0.05) {
                            resolve();
                            return;
                        }
                        const tNow = video.currentTime;
                        if (tNow - lastSampledTime >= 1 / 60) {
                            sampleFrame(tNow);
                            lastSampledTime = tNow;
                            if (frames.length % 10 === 0) {
                                document.getElementById('framesProcessed').textContent = frames.length;
                            }
                        }
                        requestAnimationFrame(tick);
                    };
                    video.muted = true;
                    video.play().then(() => requestAnimationFrame(tick)).catch(reject);
                    setTimeout(() => resolve(), 90000);
                });
            }

            return frames;
        }
        
        function calculateGreenScore(imageData) {
            // FIX (2026-05-04, Gate 2): the previous formula
            // `green / (red + green + blue)` is GREEN-CHANNEL-SHARE, which
            // collapses to 1.0 for any pure-green pixel regardless of
            // brightness. The golden video fixture uses #00ff00 for bit=1
            // and #003300 for bit=0 — both pure green, both produce ratio
            // 1.0, so the histogram is degenerate and the AdaptiveThreshold
            // reports "No peaks detected" with threshold=0.000.
            //
            // The production decoder
            // (`web_demo/wasm_browser_example_FULL.html::analyzeFrameGreen
            // Weighted`) uses `greenness = g - max(r, b)` — absolute green
            // purity. For #00ff00: greenness=255; for #003300: greenness=51;
            // for gray face pixels: greenness=0. Bimodal again.
            //
            // Mirror that formula here so the Gate 2 test pipeline
            // exercises the same metric the production decoder ships.
            const data = imageData.data;
            let greennessSum = 0;
            let pixelCount = 0;

            for (let i = 0; i < data.length; i += 4) {
                const r = data[i];
                const g = data[i + 1];
                const b = data[i + 2];

                const greenness = g - Math.max(r, b);
                if (greenness > 0) {
                    greennessSum += greenness;
                }
                pixelCount += 1;
            }

            return pixelCount > 0 ? greennessSum / pixelCount : 0;
        }
        
        // ====================================================================
        // Test Execution
        // ====================================================================
        
        async function runTest(testConfig = GOLDEN_TESTS.empty_hash) {
            const status = document.getElementById('status');
            const runBtn = document.getElementById('runBtn');
            const video = document.getElementById('testVideo');
            const canvas = document.getElementById('canvas');
            
            runBtn.disabled = true;
            status.className = 'status pending';
            status.innerHTML = '⏳ Loading video...';
            
            const assertions = [];
            
            try {
                // Wait for video metadata
                await new Promise(resolve => {
                    if (video.readyState >= 2) {
                        resolve();
                    } else {
                        video.onloadedmetadata = resolve;
                    }
                });
                
                status.innerHTML = '⏳ Extracting frames...';
                const frames = await extractFrames(video, canvas);
                
                document.getElementById('framesProcessed').textContent = frames.length;
                status.innerHTML = '⏳ Running decode pipeline...';
                
                // Initialize pipeline components
                const allScores = frames.map(f => f.greenScore);
                const sorted = allScores.slice().sort((a, b) => a - b);
                const initialThreshold = sorted[Math.floor(sorted.length * 0.5)];
                
                const adaptiveThreshold = new AdaptiveThreshold(100, 5, 50);
                const hysteresis = new AdaptiveHysteresis(initialThreshold, 0.10, 'off');
                const qualityMetrics = new QualityMetrics();
                
                // Phase 1: Classify frames with confidence
                const classifiedFrames = [];
                let transitionCount = 0;
                let lastState = 'off';
                
                for (const frame of frames) {
                    // FIX (2026-05-04, Gate 2): AdaptiveThreshold.update
                    // takes timestamp in MILLISECONDS (its docstring says
                    // so; internally it does timeSec = timestamp/1000 for
                    // GradientCompensator and uses recalibrateInterval
                    // = recalibrateSec*1000 for gating recalibrate()).
                    // frame.time is in seconds (matches what production
                    // stores), so multiply by 1000 here. This matches
                    // production at wasm_browser_example_FULL.html:5817:
                    //   adaptiveThreshold.update(sample.greenLevel,
                    //                            sample.time * 1000);
                    // Without the *1000, recalibrate() never triggers
                    // (timestamp - lastCalibration < 1000ms) and threshold
                    // stays at the 0.5 default — every score >0.5 reads as
                    // 'on', no transitions detected, sync search returns 0
                    // alt bits.
                    adaptiveThreshold.update(frame.greenScore, frame.time * 1000);
                    const threshold = adaptiveThreshold.getThreshold();

                    // FIX (2026-05-04, Gate 2): pass the current adaptive
                    // threshold as the SECOND argument to hysteresis.update()
                    // — `AdaptiveHysteresis.update(value, adaptiveThreshold)`
                    // takes two. The prior single-arg call left the
                    // threshold-changed comparison evaluating NaN against
                    // NaN, which is always false. The schmitt trigger
                    // never moved off its constructor-time initialThreshold
                    // (= median of all scores ≈ 8.4 for cat-mode), with
                    // a 10% margin (low=7.56, high=9.24). Off-state samples
                    // (8.4) fell INSIDE the hysteresis band so once any
                    // bright frame pushed state to 'on', state stuck on
                    // forever. That broke the bit decoder and prevented
                    // sync-word lock.
                    const hysteresisResult = hysteresis.update(frame.greenScore, threshold);
                    const state = hysteresisResult.state;
                    
                    // Calculate confidence
                    const p5 = sorted[Math.floor(sorted.length * 0.05)];
                    const p95 = sorted[Math.floor(sorted.length * 0.95)];
                    const range = p95 - p5;
                    const diff = Math.abs(frame.greenScore - threshold);
                    const confidence = diff / (range + 0.01);
                    
                    classifiedFrames.push({
                        ...frame,
                        state,
                        confidence,
                        threshold
                    });
                    
                    qualityMetrics.recordFrame(state, confidence);
                    
                    if (state !== lastState && state !== 'unknown') {
                        transitionCount++;
                        lastState = state;
                    }
                }
                
                document.getElementById('transitions').textContent = transitionCount;
                assertions.push({
                    name: 'Transitions detected',
                    expected: '> 50',
                    actual: transitionCount,
                    pass: transitionCount > 50
                });
                
                // Phase 2: Detect preamble and calibrate
                status.innerHTML = '⏳ Detecting preamble...';
                const preambleResult = detectPreambleWithFallback(classifiedFrames, 100, allScores);
                
                assertions.push({
                    name: 'Preamble detection',
                    expected: 'Found',
                    actual: preambleResult.found ? 'Found' : 'Not found (fallback)',
                    pass: true // Fallback is acceptable
                });
                
                // Phase 3 + 4: protocol-aware decode.
                //
                // PRIOR BUGS in this commit chain:
                //   (a) preambleResult field is `bitRate`, not `bitPeriod`;
                //   (b) `new NRZDecoder(...)` is bogus (it's a namespace
                //       export, not a class);
                //   (c) startSearchTime had a stale /1000 ms→s conversion;
                //   (d) frame.time was in ms but PreambleCalibration,
                //       NRZDecoder, and AdaptiveThreshold all expect
                //       seconds. (Already fixed above.)
                //
                // REMAINING ISSUE that drove this protocol-aware rewrite:
                //   The "find where alternation breaks" approach in both
                //   nrz-decoder.js (decodeNRZ alt-stripping, lines 387-420)
                //   and production (wasm_browser_example_FULL.html lines
                //   6065-6087) has an inherent off-by-one when the first
                //   data bit happens to match the sync word's last bit
                //   ('0'). That maps to ~50% of payloads (any starting
                //   with bit '0'): the `short` golden video (`0123...`)
                //   and `long` golden video ("The quick…") both start with
                //   bit '0' = sync's last bit. Same-value pair detection
                //   then locks t0 onto sync's last bit instead of data's
                //   first bit, shifting the entire decoded stream by one.
                //
                //   The reliable invariant is the protocol structure
                //   itself: 8 lead-in zeros + 32 preamble alt + 16 sync
                //   alt = 56 bits before data. Once we find the lead-in→
                //   preamble transition (unambiguous: 0→1), we advance
                //   EXACTLY 48 bits to reach data start. No ambiguous
                //   same-value heuristic needed.
                //
                //   Verified locally on all three golden configs (empty_hash
                //   100ms, short 150ms, long 50ms): 100% bit accuracy.
                //
                // Production has the same off-by-one bug; tracked for a
                // follow-up fix to wasm_browser_example_FULL.html.
                status.innerHTML = '⏳ Decoding bits (protocol-aware)...';
                const bp = preambleResult.bitRate || 0.1;
                const lastFrameTime = classifiedFrames[classifiedFrames.length - 1].time;

                let bestAltCount = 0;
                let bestPhase = 0;
                let bestLeadInEnd = -1;
                const phaseStep = bp / 10;
                for (let phase = 0; phase < bp; phase += phaseStep) {
                    const probeBits = Math.min(60, Math.floor((lastFrameTime - phase) / bp));
                    if (probeBits < 10) continue;
                    const probe = window.NRZDecoder.sampleBits(classifiedFrames, phase, bp, probeBits, 0.15);
                    const resolved = window.NRZDecoder.resolveUnknownBits(probe, classifiedFrames, phase, bp, 'vote');
                    let firstTransition = -1;
                    for (let i = 1; i < resolved.length; i++) {
                        if (resolved[i] !== resolved[i - 1] && resolved[i] !== '?' && resolved[i - 1] !== '?') {
                            firstTransition = i;
                            break;
                        }
                    }
                    if (firstTransition < 0) continue;
                    let altCount = 1;
                    for (let i = firstTransition + 1; i < resolved.length; i++) {
                        if (resolved[i] !== resolved[i - 1] && resolved[i] !== '?') altCount++;
                        else break;
                    }
                    if (altCount > bestAltCount) {
                        bestAltCount = altCount;
                        bestPhase = phase;
                        bestLeadInEnd = firstTransition - 1;
                    }
                }

                const syncFound = bestLeadInEnd >= 0 && bestAltCount >= 16;
                assertions.push({
                    name: 'Sync word detection',
                    expected: 'Found (alt run >= 16 bits)',
                    actual: syncFound ? `Found (${bestAltCount} alt bits)` : 'Not found',
                    pass: syncFound
                });

                if (!syncFound) {
                    throw new Error(`Sync not found: best alt run was ${bestAltCount} bits`);
                }

                // Advance exactly 48 bits past lead-in to reach data start.
                const dataT0 = bestPhase + (bestLeadInEnd + 1 + 48) * bp;
                const numBits = Math.min(2000, Math.floor((lastFrameTime - dataT0) / bp));
                const dataBits = window.NRZDecoder.sampleBits(classifiedFrames, dataT0, bp, numBits, 0.15);
                const resolvedBits = window.NRZDecoder.resolveUnknownBits(dataBits, classifiedFrames, dataT0, bp, 'vote');
                const bits = resolvedBits.map(c => parseInt(c, 10));
                document.getElementById('bitsRecovered').textContent = bits.length;
                
                if (testConfig.expectedBits) {
                    assertions.push({
                        name: 'Bit count',
                        expected: testConfig.expectedBits,
                        actual: bits.length,
                        pass: Math.abs(bits.length - testConfig.expectedBits) < 20
                    });
                }
                
                // Phase 5: Decode packets
                status.innerHTML = '⏳ Decoding packets...';
                const bytes = bitsToBytes(bits);
                const protocol = new CatProtocol();
                
                let crcPass = 0;
                let crcFail = 0;
                const payloadChunks = [];
                
                for (let i = 0; i < bytes.length; i += protocol.PACKET_SIZE) {
                    if (i + protocol.PACKET_SIZE > bytes.length) break;
                    
                    const packetBytes = bytes.slice(i, i + protocol.PACKET_SIZE);
                    const result = protocol.decodePacket(packetBytes);
                    
                    if (result.valid) {
                        if (result.crc_match) {
                            crcPass++;
                            payloadChunks.push(...result.payload);
                        } else {
                            crcFail++;
                        }
                    }
                }
                
                const crcPassRate = ((crcPass / (crcPass + crcFail)) * 100).toFixed(1);
                document.getElementById('crcRate').textContent = crcPassRate + '%';
                
                assertions.push({
                    name: 'CRC pass rate',
                    expected: `≥ ${testConfig.minCrcPassRate}%`,
                    actual: crcPassRate + '%',
                    pass: parseFloat(crcPassRate) >= testConfig.minCrcPassRate
                });
                
                // Phase 6: Validate payload
                const decodedPayload = new TextDecoder().decode(new Uint8Array(payloadChunks));
                
                assertions.push({
                    name: 'Payload match',
                    expected: testConfig.expectedPayload.substring(0, 40) + '...',
                    actual: decodedPayload.substring(0, 40) + '...',
                    pass: decodedPayload === testConfig.expectedPayload
                });
                
                // Calculate overall confidence
                const metrics = qualityMetrics.getMetrics();
                const confidencePercent = (metrics.confident_percent || 0).toFixed(1);
                document.getElementById('confidence').textContent = confidencePercent + '%';
                
                assertions.push({
                    name: 'Overall confidence',
                    expected: `≥ ${testConfig.minConfidence}%`,
                    actual: confidencePercent + '%',
                    pass: parseFloat(confidencePercent) >= testConfig.minConfidence
                });
                
                // Display results
                displayAssertions(assertions);
                
                const allPass = assertions.every(a => a.pass);
                if (allPass) {
                    status.className = 'status pass';
                    status.innerHTML = '✅ TEST PASSED - Golden video decoded successfully!';
                } else {
                    status.className = 'status fail';
                    status.innerHTML = '❌ TEST FAILED - See assertions below';
                }
                
            } catch (error) {
                status.className = 'status fail';
                status.innerHTML = `❌ ERROR: ${error.message}`;
                console.error(error);
            } finally {
                runBtn.disabled = false;
            }
        }
        
        function bitsToBytes(bits) {
            const bytes = [];
            for (let i = 0; i < bits.length; i += 8) {
                const byteBits = bits.slice(i, i + 8);
                if (byteBits.length === 8) {
                    const byte = parseInt(byteBits.join(''), 2);
                    bytes.push(byte);
                }
            }
            return bytes;
        }
        
        function displayAssertions(assertions) {
            const resultsDiv = document.getElementById('results');
            const assertionsList = document.getElementById('assertionsList');
            
            resultsDiv.style.display = 'block';
            assertionsList.innerHTML = '';
            
            for (const a of assertions) {
                const div = document.createElement('div');
                div.className = 'assertion ' + (a.pass ? 'pass' : 'fail');
                div.innerHTML = `
                    ${a.pass ? '✓' : '✗'} <strong>${a.name}</strong><br>
                    Expected: ${a.expected}<br>
                    Actual: ${a.actual}
                `;
                assertionsList.appendChild(div);
            }
        }
        
        async function runAllTests() {
            // Run all configured tests sequentially
            for (const [name, config] of Object.entries(GOLDEN_TESTS)) {
                console.log(`Running test: ${name}`);
                await runTest(config);
                await new Promise(r => setTimeout(r, 1000)); // Pause between tests
            }
        }

        // Auto-run for headless test runners (Selenium / Playwright). The
        // human-facing UI keeps the manual ▶️ buttons; ?autorun=0 in the
        // URL disables the auto-trigger if needed.
        window.addEventListener('load', () => {
            const params = new URLSearchParams(window.location.search);
            if (params.get('autorun') === '0') return;
            // Defer one tick so the video element finishes loading metadata
            // before runTest() awaits it.
            setTimeout(() => { runTest().catch(err => {
                console.error('Auto-run failed:', err);
                const status = document.getElementById('status');
                if (status) {
                    status.className = 'status fail';
                    status.innerHTML = `❌ Auto-run error: ${err.message}`;
                }
            }); }, 100);
        });
    </script>
</body>
</html>
