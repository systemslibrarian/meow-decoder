[[IgnoredVulns]]
id = "GHSA-qr4w-53vh-m672"
reason = """opencv-python bundled libwebp (CVE-2023-4863) — cv2 is used exclusively for \
VideoCapture (webcam frames). No calls to imread, imdecode, imwrite, or imencode exist. \
No .webp files are ever processed. Webcam frames are raw BGR numpy arrays."""

[[IgnoredVulns]]
id = "PYSEC-2023-183"
reason = """Alias for GHSA-qr4w-53vh-m672 — opencv-python libwebp not exercised; only \
webcam capture used."""

[[IgnoredVulns]]
id = "GHSA-j7hp-h8jx-5ppr"
reason = """Pillow bundled libwebp (CVE-2023-4863) — Pillow is used only for GIF and PNG \
image generation/reading. No .webp files are ever opened or processed. The vulnerable \
