# Rust Crypto Backend CI Workflow
# Builds and tests the PyO3 Rust extension for multiple platforms

name: Rust Crypto Backend

on:
  push:
    branches: [main]
    paths:
      - "rust_crypto/**"
      - ".github/workflows/rust-crypto.yml"
  pull_request:
    branches: [main]
    paths:
      - "rust_crypto/**"
  release:
    types: [published]
  workflow_dispatch: # Allow manual trigger

permissions:
  contents: read

jobs:
  # ===========================================================================
  # Build and test on Linux
  # ===========================================================================
  linux:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.3.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Rust
        uses: dtolnay/rust-toolchain@d0592fe69e35bc8f12e3dbaf9ad2694d976cb8e3 # stable
        with:
          toolchain: stable

      - name: Install system dependencies (C compiler + PCSC for YubiKey support)
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libssl-dev pkg-config libpcsclite-dev libudev-dev

      - name: Install maturin
        run: pip install maturin==1.11.5

      - name: Build wheel
        run: |
          cd rust_crypto
          maturin build --release --out dist

      - name: Install and test
        # Local wheel install - can't hash-pin freshly-built artifacts
        run: |
          pip install --no-deps rust_crypto/dist/*.whl
          python -c "import meow_crypto_rs; print(f'Rust backend loaded: {meow_crypto_rs.backend_info()}')"

      - name: Run compatibility tests
        # Editable install for local source - can't hash-pin
        run: |
          pip install pytest pytest-cov cryptography argon2-cffi numpy hypothesis || true
          pip install --no-deps -e .
          pytest tests/test_crypto_backend.py -v
        env:
          MEOW_TEST_MODE: "1"
          MEOW_PRODUCTION_MODE: "0" # Required alongside MEOW_TEST_MODE to allow export_key() in tests

      - name: Upload wheel
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.0
        with:
          name: wheel-linux-py${{ matrix.python-version }}
          path: rust_crypto/dist/*.whl

  # ===========================================================================
  # Build and test on macOS (Intel + ARM)
  # ===========================================================================
  macos:
    runs-on: macos-latest
    timeout-minutes: 30
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
        target: ["x86_64-apple-darwin", "aarch64-apple-darwin"]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.3.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Rust
        uses: dtolnay/rust-toolchain@d0592fe69e35bc8f12e3dbaf9ad2694d976cb8e3 # stable
        with:
          toolchain: stable
          targets: ${{ matrix.target }}

      - name: Install maturin
        run: pip install maturin==1.11.5

      - name: Build wheel
        run: |
          cd rust_crypto
          maturin build --release --target ${{ matrix.target }} --out dist

      - name: Install and test (native only)
        # Local wheel install - can't hash-pin freshly-built artifacts
        if: matrix.target == 'aarch64-apple-darwin'
        run: |
          pip install --no-deps rust_crypto/dist/*.whl
          python -c "import meow_crypto_rs; print(f'Rust backend loaded: {meow_crypto_rs.backend_info()}')"

      - name: Upload wheel
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.0
        with:
          name: wheel-macos-${{ matrix.target }}-py${{ matrix.python-version }}
          path: rust_crypto/dist/*.whl

  # ===========================================================================
  # Build and test on Windows
  # ===========================================================================
  windows:
    runs-on: windows-latest
    timeout-minutes: 30
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.3.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Rust
        uses: dtolnay/rust-toolchain@d0592fe69e35bc8f12e3dbaf9ad2694d976cb8e3 # stable
        with:
          toolchain: stable

      - name: Install maturin
        run: pip install maturin==1.11.5

      - name: Build wheel
        run: |
          cd rust_crypto
          maturin build --release --out dist

      - name: Install and test
        # Local wheel install - can't hash-pin freshly-built artifacts
        run: |
          pip install --no-deps (Get-ChildItem rust_crypto/dist/*.whl).FullName
          python -c "import meow_crypto_rs; print(f'Rust backend loaded')"
        shell: pwsh

      - name: Upload wheel
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.0
        with:
          name: wheel-windows-py${{ matrix.python-version }}
          path: rust_crypto/dist/*.whl

  # ===========================================================================
  # Build manylinux wheels for PyPI
  # ===========================================================================
  manylinux:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: github.event_name == 'release'
    strategy:
      matrix:
        target: ["x86_64-unknown-linux-gnu", "aarch64-unknown-linux-gnu"]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Build wheels
        uses: PyO3/maturin-action@aef21716846a0e637cf3aab4b73754a9e3c4f2a5 # v1
        with:
          target: ${{ matrix.target }}
          args: --release --out dist -m rust_crypto/Cargo.toml
          manylinux: auto

      - name: Upload wheels
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.0
        with:
          name: wheel-manylinux-${{ matrix.target }}
          path: dist/*.whl

  # ===========================================================================
  # Publish to PyPI on release
  # ===========================================================================
  publish:
    name: Publish to PyPI
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: github.event_name == 'release'
    needs: [linux, macos, windows, manylinux]
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v4.1.8
        with:
          path: dist
          merge-multiple: true

      - name: Display structure of downloaded files
        run: ls -lR dist

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@76f52bc884231f62b54e755689f2957b6c0a7cfb # release/v1
        with:
          password: ${{ secrets.PYPI_API_TOKEN }}
          packages-dir: dist/

  # ===========================================================================
  # Rust code quality (security audit runs in security-ci.yml)
  # ===========================================================================
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install Rust
        uses: dtolnay/rust-toolchain@d0592fe69e35bc8f12e3dbaf9ad2694d976cb8e3 # stable
        with:
          toolchain: stable
          components: clippy, rustfmt

      - name: Check formatting
        run: |
          cd rust_crypto
          cargo fmt --check

      - name: Clippy lints
        run: |
          cd rust_crypto
          cargo clippy -- -D warnings
