name: Rust Tests & Coverage

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:  # Allows manual trigger from GitHub UI

permissions:
  contents: read

jobs:
  test-and-coverage:
    name: Test + Tarpaulin Coverage (Ubuntu)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0  # Useful if you need git history for anything

      - name: Install Rust stable toolchain
        uses: dtolnay/rust-toolchain@d0592fe69e35bc8f12e3dbaf9ad2694d976cb8e3 # stable
        with:
          toolchain: stable

      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@779680da715d629ac1d338a641029a2f4372abb5 # v2.7.7
        with:
          workspaces: |
            rust_crypto
            crypto_core
          # If you have a workspace root Cargo.toml, it will cache the whole thing automatically

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libpcsclite-dev libudev-dev pkg-config
        
      - name: Install cargo-tarpaulin
        run: cargo install cargo-tarpaulin

      # Note: rust_crypto is a PyO3 cdylib extension - it cannot be tested standalone with tarpaulin
      # Its coverage comes from Python tests (tests/test_rust_crypto_backend.py)
      # We only run tarpaulin on crypto_core (pure Rust)

      - name: Run tests with coverage (crypto_core)
        run: |
          cargo tarpaulin \
            --features "pure-crypto,pq-crypto" \
            --out Lcov \
            --output-dir . \
            --timeout 300
        working-directory: ./crypto_core

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@671740ac38dd9b0130fbe1cec585b89eea48d3de # v5.3.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./crypto_core/lcov.info
          flags: rust
          name: rust-coverage
          fail_ci_if_error: false

      - name: Run regular tests (crypto_core, without coverage)
        if: always()
        run: |
          cd crypto_core && cargo test --features "pure-crypto,pq-crypto"