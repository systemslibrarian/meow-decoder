name: Rust Tests & Coverage

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:  # Allows manual trigger from GitHub UI

permissions:
  contents: write  # Required to push coverage badge

jobs:
  test-and-coverage:
    name: Test + Tarpaulin Coverage (Ubuntu)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0  # Useful if you need git history for anything

      - name: Install Rust stable toolchain
        uses: dtolnay/rust-toolchain@d0592fe69e35bc8f12e3dbaf9ad2694d976cb8e3 # stable
        with:
          toolchain: stable

      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@779680da715d629ac1d338a641029a2f4372abb5 # v2.7.7
        with:
          workspaces: |
            rust_crypto
            crypto_core
          # If you have a workspace root Cargo.toml, it will cache the whole thing automatically

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libpcsclite-dev libudev-dev pkg-config
        
      - name: Install cargo-tarpaulin
        run: cargo install cargo-tarpaulin

      # Note: rust_crypto now has crate-type = ["cdylib", "lib"]
      # The "lib" target allows tarpaulin to instrument and track coverage.
      # Tests call through meow_crypto_rs::pure to exercise rust_crypto/src/pure.rs

      - name: Run tests with coverage (crypto_core)
        id: tarpaulin
        run: |
          cargo tarpaulin \
            --features "pure-crypto,pq-crypto" \
            --out Lcov \
            --out Json \
            --output-dir . \
            --timeout 300 \
            --exclude-files "src/wasm.rs" \
            --exclude-files "src/hsm.rs" \
            --exclude-files "src/tpm.rs" \
            --exclude-files "src/yubikey_piv.rs" \
            --exclude-files "src/verus_proofs.rs" \
            --exclude-files "src/verus_kdf_proofs.rs" 2>&1 | tee tarpaulin-output.txt
          
          # Extract coverage percentage from output
          COVERAGE=$(grep -oP '\d+\.\d+% coverage' tarpaulin-output.txt | head -1 | grep -oP '\d+\.\d+')
          echo "coverage=$COVERAGE" >> $GITHUB_OUTPUT
          echo "Rust coverage: $COVERAGE%"
        working-directory: ./crypto_core

      - name: Run tests with coverage (rust_crypto)
        id: tarpaulin_rust_crypto
        run: |
          cargo tarpaulin \
            --lib --tests \
            --features "pq" \
            --out Lcov \
            --out Json \
            --output-dir . \
            --timeout 300 \
            --exclude-files "src/lib.rs" 2>&1 | tee tarpaulin-output.txt
          
          COVERAGE=$(grep -oP '\d+\.\d+% coverage' tarpaulin-output.txt | head -1 | grep -oP '\d+\.\d+')
          echo "coverage=$COVERAGE" >> $GITHUB_OUTPUT
          echo "rust_crypto coverage: $COVERAGE%"
        working-directory: ./rust_crypto

      - name: Generate coverage badge
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: |
          COVERAGE="${{ steps.tarpaulin.outputs.coverage }}"
          
          # Determine badge color based on coverage
          if (( $(echo "$COVERAGE >= 90" | bc -l) )); then
            COLOR="brightgreen"
          elif (( $(echo "$COVERAGE >= 80" | bc -l) )); then
            COLOR="green"
          elif (( $(echo "$COVERAGE >= 70" | bc -l) )); then
            COLOR="yellowgreen"
          elif (( $(echo "$COVERAGE >= 60" | bc -l) )); then
            COLOR="yellow"
          else
            COLOR="red"
          fi
          
          # Generate SVG badge
          cat > assets/coverage.svg << EOF
          <svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="130" height="20" role="img" aria-label="Rust Coverage: ${COVERAGE}%">
            <title>Rust Coverage: ${COVERAGE}%</title>
            <linearGradient id="s" x2="0" y2="100%">
              <stop offset="0" stop-color="#bbb" stop-opacity=".1"/>
              <stop offset="1" stop-opacity=".1"/>
            </linearGradient>
            <clipPath id="r">
              <rect width="130" height="20" rx="3" fill="#fff"/>
            </clipPath>
            <g clip-path="url(#r)">
              <rect width="85" height="20" fill="#555"/>
              <rect x="85" width="45" height="20" fill="#4c1"/>
              <rect width="130" height="20" fill="url(#s)"/>
            </g>
            <g fill="#fff" text-anchor="middle" font-family="Verdana,Geneva,DejaVu Sans,sans-serif" text-rendering="geometricPrecision" font-size="110">
              <text aria-hidden="true" x="435" y="150" fill="#010101" fill-opacity=".3" transform="scale(.1)" textLength="750">Rust Coverage</text>
              <text x="435" y="140" transform="scale(.1)" fill="#fff" textLength="750">Rust Coverage</text>
              <text aria-hidden="true" x="1065" y="150" fill="#010101" fill-opacity=".3" transform="scale(.1)" textLength="350">${COVERAGE}%</text>
              <text x="1065" y="140" transform="scale(.1)" fill="#fff" textLength="350">${COVERAGE}%</text>
            </g>
          </svg>
          EOF
          echo "Generated badge with ${COVERAGE}% coverage"

      - name: Commit coverage badge
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        env:
          BADGE_PUSH_TOKEN: ${{ secrets.BADGE_PUSH_TOKEN }}
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add assets/coverage.svg
          if ! git diff --staged --quiet; then
            git commit -m "chore: update Rust coverage badge [skip ci]"
            if [ -n "$BADGE_PUSH_TOKEN" ]; then
              git push https://x-access-token:${BADGE_PUSH_TOKEN}@github.com/${{ github.repository }}.git HEAD:main
            else
              echo "::warning::BADGE_PUSH_TOKEN not set - skipping push to protected branch"
            fi
          fi

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@671740ac38dd9b0130fbe1cec585b89eea48d3de # v5.3.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./crypto_core/lcov.info,./rust_crypto/lcov.info
          flags: rust
          name: rust-coverage
          fail_ci_if_error: false

      - name: Run regular tests (crypto_core, without coverage)
        if: always()
        run: |
          cd crypto_core && cargo test --features "pure-crypto,pq-crypto"

      - name: Run regular tests (rust_crypto, without coverage)
        if: always()
        run: |
          cd rust_crypto && cargo test --features "pq"