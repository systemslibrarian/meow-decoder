name: CI - Tests + Coverage

on:
  push:
    branches: ["main"]
    paths-ignore:
      - 'docs/**'
      - '*.md'
      - 'assets/**'
      - 'sounds/**'
      - '.github/CODEOWNERS'
  pull_request:
    branches: ["main"]
    paths-ignore:
      - 'docs/**'
      - '*.md'
      - 'assets/**'
      - 'sounds/**'
      - '.github/CODEOWNERS'

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# ─── Shared environment ──────────────────────────────────────────────────────
env:
  MEOW_TEST_MODE: "1"
  MEOW_CRYPTO_BACKEND: "rust"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PYTHONDONTWRITEBYTECODE: "1"

jobs:
  # ═══════════════════════════════════════════════════════════════════════════
  # GATE 1: Fast tests (excludes @pytest.mark.slow)
  # ═══════════════════════════════════════════════════════════════════════════
  test:
    name: "Gate 1: Tests + Coverage"
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.3.0
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libzbar0 libgl1 libglib2.0-0 \
            build-essential pkg-config libssl-dev \
            libpcsclite-dev libudev-dev

      - uses: actions-rust-lang/setup-rust-toolchain@9399c7bb15d4c7d47b27263d024f0a4978346ba4 # v1.11.0
        with:
          toolchain: stable

      - name: Install Python dependencies
        run: |
          pip install --require-hashes -r requirements-pip.lock
          pip install --require-hashes -r requirements.lock
          pip install --require-hashes -r requirements-dev.lock
          pip install --require-hashes -r requirements-ci.lock

      - name: Build and install Rust crypto backend
        # Local wheel install - can't hash-pin freshly-built artifacts
        run: |
          cd rust_crypto
          maturin build --release --out dist
          python -m pip install --force-reinstall --no-deps dist/*.whl
          cd ..

      - name: Verify Rust backend
        run: python -c "import meow_crypto_rs; print('Rust backend OK')"

      - name: Run test suite (no slow markers)
        run: |
          pytest -m "not slow" \
            --override-ini="addopts=" \
            --cov=meow_decoder \
            --cov-config=.coveragerc \
            --cov-report=xml:coverage.xml \
            --cov-report=term-missing \
            --cov-fail-under=0 \
            -q --no-header

          if [ ! -f coverage.xml ]; then
            coverage xml -o coverage.xml --rcfile=.coveragerc || true
          fi

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@671740ac38dd9b0130fbe1cec585b89eea48d3de # v5.3.1
        with:
          files: ./coverage.xml
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false
          verbose: true
          name: python-coverage
          flags: python

  # ═══════════════════════════════════════════════════════════════════════════
  # GATE 2: Security coverage ≥ 85% (TIER 1 modules)
  # ═══════════════════════════════════════════════════════════════════════════
  security-coverage:
    name: "Gate 2: Security Coverage ≥85%"
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.3.0
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libzbar0 libgl1 libglib2.0-0 \
            build-essential pkg-config libssl-dev \
            libpcsclite-dev libudev-dev

      - uses: actions-rust-lang/setup-rust-toolchain@9399c7bb15d4c7d47b27263d024f0a4978346ba4 # v1.11.0
        with:
          toolchain: stable

      - name: Install Python + Rust backend
        # Local wheel install - can't hash-pin freshly-built artifacts
        run: |
          pip install --require-hashes -r requirements-pip.lock
          pip install --require-hashes -r requirements.lock
          pip install --require-hashes -r requirements-dev.lock
          pip install --require-hashes -r requirements-ci.lock
          cd rust_crypto && maturin build --release --out dist && pip install --force-reinstall --no-deps dist/*.whl && cd ..

      - name: Security coverage gate
        run: |
          pytest tests/ -m "security or crypto or adversarial" \
            --override-ini="addopts=" \
            --cov --cov-config=.coveragerc-security \
            --cov-fail-under=30 \
            --cov-report=term-missing \
            -q --no-header

  # ═══════════════════════════════════════════════════════════════════════════
  # GATE 3: Lint + type check (flake8, black, mypy, bandit)
  # ═══════════════════════════════════════════════════════════════════════════
  lint:
    name: "Gate 3: Lint + Type Check"
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.3.0
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          pip install --require-hashes -r requirements-pip.lock
          pip install --require-hashes -r requirements.lock
          pip install --require-hashes -r requirements-dev.lock
          pip install --require-hashes -r requirements-ci.lock

      - name: flake8 lint
        run: flake8 meow_decoder/

      - name: black format check
        run: black --check --diff meow_decoder/

      - name: mypy type check
        run: mypy meow_decoder/ --ignore-missing-imports --no-error-summary

      - name: bandit security lint
        run: bandit -r meow_decoder/ -ll -q || true

  # ═══════════════════════════════════════════════════════════════════════════
  # Required status check — all 3 gates must pass for merge
  # ═══════════════════════════════════════════════════════════════════════════
  all-gates:
    name: "All CI Gates"
    needs: [test, security-coverage, lint]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Check gate results
        run: |
          if [[ "${{ needs.test.result }}" != "success" ]]; then
            echo "❌ Gate 1 (Tests) failed"
            exit 1
          fi
          if [[ "${{ needs.security-coverage.result }}" != "success" ]]; then
            echo "❌ Gate 2 (Security Coverage) failed"
            exit 1
          fi
          if [[ "${{ needs.lint.result }}" != "success" ]]; then
            echo "❌ Gate 3 (Lint) failed"
            exit 1
          fi
          echo "✅ All 3 CI gates passed"