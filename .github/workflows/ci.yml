name: CI - Tests + Coverage

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# ─── Shared environment ──────────────────────────────────────────────────────
env:
  MEOW_TEST_MODE: "1"
  MEOW_PRODUCTION_MODE: "0" # Required alongside MEOW_TEST_MODE to allow export_key() in tests
  MEOW_CRYPTO_BACKEND: "rust"
  RUST_BACKEND_REQUIRED: "1" # Phase 5: Fail closed if Rust backend unavailable
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PYTHONDONTWRITEBYTECODE: "1"

jobs:
  # ═══════════════════════════════════════════════════════════════════════════
  # PREFLIGHT: Fast sanity checks — lock files, formatting, lint
  # Catches the most common failures in <60s before burning CI minutes
  # ═══════════════════════════════════════════════════════════════════════════
  preflight:
    name: "Preflight: Lint + Lock Check"
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
          cache: "pip"

      # -- Lock file verification (catches hash mismatches early) --
      - name: Verify lock files are installable
        run: |
          pip install --require-hashes -r requirements-pip.lock
          pip install --dry-run --require-hashes -r requirements.lock 2>&1 | tail -5
          pip install --dry-run --require-hashes -r requirements-dev.lock 2>&1 | tail -5
          pip install --dry-run --require-hashes -r requirements-ci.lock 2>&1 | tail -5
          echo "✅ All lock files verified"

      # -- Install lint tools only --
      - name: Install lint tools
        run: |
          pip install --require-hashes -r requirements-ci.lock

      # -- Fast checks that don't need Rust or system deps --
      - name: black format check
        run: black --check --diff meow_decoder/

      - name: flake8 lint
        run: flake8 meow_decoder/

      - name: mypy type check
        run: mypy meow_decoder/ --ignore-missing-imports --no-error-summary

      - name: bandit security lint
        run: bandit -r meow_decoder/ -ll -q || true

      # -- Crypto migration gate (fast grep check) --
      - name: Check core crypto files for forbidden imports
        run: |
          echo "🔐 Checking core crypto files for forbidden Python crypto imports..."
          # Core files that MUST be migrated (fail if they import cryptography/hmac/hashlib)
          CORE_FILES="meow_decoder/crypto.py meow_decoder/crypto_enhanced.py meow_decoder/ratchet.py meow_decoder/pq_hybrid.py meow_decoder/forward_secrecy.py"
          FORBIDDEN_PATTERN="^[[:space:]]*(from|import)[[:space:]]+(cryptography|hmac|hashlib)"
          VIOLATIONS=""
          for f in $CORE_FILES; do
            if [ -f "$f" ]; then
              matches=$(grep -n -E "$FORBIDDEN_PATTERN" "$f" 2>/dev/null || true)
              if [ -n "$matches" ]; then
                VIOLATIONS="$VIOLATIONS\n$f:\n$matches"
              fi
            fi
          done
          if [ -n "$VIOLATIONS" ]; then
            echo "❌ Forbidden Python crypto imports found in core files:"
            echo -e "$VIOLATIONS"
            echo ""
            echo "Core crypto files must use the Rust backend (meow_crypto_rs)."
            exit 1
          fi
          echo "✅ Core crypto files are clean"

  # ═══════════════════════════════════════════════════════════════════════════
  # GATE 1a/1b/1c: Tests split into three parallel batches to avoid timeouts.
  # These shards validate correctness only. Coverage tracking lives in Gate 5,
  # which scopes measurement to the curated security-critical module set.
  # ═══════════════════════════════════════════════════════════════════════════
  test-batch-1:
    name: "Gate 1a: Tests Batch 1 (a-m)"
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libzbar0 libgl1 libglib2.0-0 ffmpeg \
            build-essential pkg-config libssl-dev \
            libpcsclite-dev libudev-dev

      - uses: dtolnay/rust-toolchain@d0592fe69e35bc8f12e3dbaf9ad2694d976cb8e3 # stable
        with:
          toolchain: stable

      - name: Install Python dependencies
        run: |
          pip install --require-hashes -r requirements-pip.lock
          pip install --require-hashes -r requirements.lock
          pip install --require-hashes -r requirements-dev.lock
          pip install --require-hashes -r requirements-ci.lock

      - name: Build and install Rust crypto backend
        # Local wheel install - can't hash-pin freshly-built artifacts
        run: |
          cd rust_crypto
          maturin build --release --out dist
          python -m pip install --force-reinstall --no-deps dist/*.whl
          cd ..

      - name: Verify Rust backend
        run: python -c "import meow_crypto_rs; print('Rust backend OK')"

      - name: Rust crypto_core tests
        run: |
          echo "🦀 Running Rust crypto_core tests..."
          cd crypto_core && cargo test --features "pure-crypto,pq-crypto" --release
          echo "✅ Rust crypto_core tests passed"

      - name: Run test suite batch 1 (a-m, no slow markers)
        run: |
          pytest -m "not slow" \
            --override-ini="addopts=" \
            --cov=meow_decoder \
            --cov-config=.coveragerc \
            --cov-report=term-missing \
            -q --no-header \
            tests/test_adversarial.py \
            tests/test_asymmetric_rekey.py \
            tests/test_audit_fixes.py \
            tests/test_bridge_protocol.py \
            tests/test_cat_blink.py \
            tests/test_cat_errors.py \
            tests/test_cat_js_runner.py \
            tests/test_cat_utils.py \
            tests/test_cat_video.py \
            tests/test_config.py \
            tests/test_constant_time.py \
            tests/test_crypto.py \
            tests/test_crypto_DEBUG.py \
            tests/test_crypto_backend.py \
            tests/test_deadmans_switch_cli.py \
            tests/test_decode_gif.py \
            tests/test_duress_mode.py \
            tests/test_e2e_crypto_fountain.py \
            tests/test_e2e_gif_ratchet.py \
            tests/test_e2e_ratchet_pipeline.py \
            tests/test_encode.py \
            tests/test_encode_DEBUG.py \
            tests/test_fail_closed_enforcement.py \
            tests/test_formal_fuzz_gaps_aead.py \
            tests/test_fountain.py \
            tests/test_fountain_montecarlo.py \
            tests/test_frame_mac.py \
            tests/test_fuzz_coverage_integration.py \
            tests/test_fuzz_targets.py \
            tests/test_gif_handler.py \
            tests/test_golden_vectors.py \
            tests/test_hardware_integration.py \
            tests/test_high_security_mode.py \
            tests/test_invariants_critical.py \
            tests/test_logo_eyes.py \
            tests/test_metadata_obfuscation.py

  test-batch-2:
    name: "Gate 1b: Tests Batch 2 (m-r)"
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libzbar0 libgl1 libglib2.0-0 \
            build-essential pkg-config libssl-dev \
            libpcsclite-dev libudev-dev

      - uses: dtolnay/rust-toolchain@d0592fe69e35bc8f12e3dbaf9ad2694d976cb8e3 # stable
        with:
          toolchain: stable

      - name: Install Python dependencies
        run: |
          pip install --require-hashes -r requirements-pip.lock
          pip install --require-hashes -r requirements.lock
          pip install --require-hashes -r requirements-dev.lock
          pip install --require-hashes -r requirements-ci.lock

      - name: Build and install Rust crypto backend
        # Local wheel install - can't hash-pin freshly-built artifacts
        run: |
          cd rust_crypto
          maturin build --release --out dist
          python -m pip install --force-reinstall --no-deps dist/*.whl
          cd ..

      - name: Verify Rust backend
        run: python -c "import meow_crypto_rs; print('Rust backend OK')"

      - name: Run test suite batch 2 (m-r, no slow markers)
        run: |
          pytest -m "not slow" \
            --override-ini="addopts=" \
            --cov=meow_decoder \
            --cov-config=.coveragerc \
            --cov-report=term-missing \
            -q --no-header \
            tests/test_mobile_bridge.py \
            tests/test_no_experimental_imports_in_production.py \
            tests/test_no_overclaims.py \
            tests/test_no_python_key_bytes.py \
            tests/test_phase5_modules.py \
            tests/test_pq_crypto_real.py \
            tests/test_pq_hybrid.py \
            tests/test_pqxdh_upgrade.py \
            tests/test_production_boundary.py \
            tests/test_production_import_boundary.py \
            tests/test_profile_required_and_checked.py \
            tests/test_formal_fuzz_gaps_fountain.py \
            tests/test_high_security_extras.py \
            tests/test_invariants_fail_closed.py \
            tests/test_progress.py \
            tests/test_property_based.py \
            tests/test_property_ratchet_pq.py \
            tests/test_property_shamir_dualstream.py \
            tests/test_qr_code.py \
            tests/test_ratchet.py

      # Python coverage is local-only (terminal report above).
      # Codecov monitors Rust coverage via rust-test-coverage.yml.

  test-batch-3:
    name: "Gate 1c: Tests Batch 3 (r-z)"
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libzbar0 libgl1 libglib2.0-0 \
            build-essential pkg-config libssl-dev \
            libpcsclite-dev libudev-dev

      - uses: dtolnay/rust-toolchain@d0592fe69e35bc8f12e3dbaf9ad2694d976cb8e3 # stable
        with:
          toolchain: stable

      - name: Install Python dependencies
        run: |
          pip install --require-hashes -r requirements-pip.lock
          pip install --require-hashes -r requirements.lock
          pip install --require-hashes -r requirements-dev.lock
          pip install --require-hashes -r requirements-ci.lock

      - name: Build and install Rust crypto backend
        # Local wheel install - can't hash-pin freshly-built artifacts
        run: |
          cd rust_crypto
          maturin build --release --out dist
          python -m pip install --force-reinstall --no-deps dist/*.whl
          cd ..

      - name: Verify Rust backend
        run: python -c "import meow_crypto_rs; print('Rust backend OK')"

      - name: Run test suite batch 3 (r-z, no slow markers)
        run: |
          pytest -m "not slow" \
            --override-ini="addopts=" \
            --cov=meow_decoder \
            --cov-config=.coveragerc \
            --cov-report=term-missing \
            -q --no-header \
            tests/test_formal_fuzz_gaps_tamper.py \
            tests/test_high_security_boost.py \
            tests/test_invariants_regressions.py \
            tests/test_rust_crypto_backend.py \
            tests/test_security_crypto.py \
            tests/test_security_frame_mac.py \
            tests/test_security_manifest.py \
            tests/test_security_hardening.py \
            tests/test_security_warnings.py \
            tests/test_setup.py \
            tests/test_sidechannel.py \
            tests/test_signal_invariants.py \
            tests/test_stego_advanced.py \
            tests/test_stego_adversarial.py \
            tests/test_stego_fuzz.py \
            tests/test_stego_multilayer.py \
            tests/test_stego_phase0.py \
            tests/test_stego_phase1.py \
            tests/test_tamper_report.py \
            tests/test_timelock_duress.py \
            tests/test_x25519_forward_secrecy.py \
            tests/test_zero_key_bytes.py \
            tests/security/

      # Python coverage is local-only (terminal report above).
      # Codecov monitors Rust coverage via rust-test-coverage.yml.

  # ═══════════════════════════════════════════════════════════════════════════
  # GATE 2: Cat Mode Golden Video Test (only runs after preflight passes)
  # ═══════════════════════════════════════════════════════════════════════════
  cat-mode-golden-test:
    name: "Gate 2: Cat Mode Golden Video"
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 10
    continue-on-error: true # Allow CI to proceed even if this gate fails

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
          cache: "pip"

      # Check for golden videos FIRST so we don't waste time installing
      # chromium + playwright when videos haven't been generated yet.
      - name: Check if golden videos exist
        id: check_golden
        run: |
          if [ -f "tests/golden/cat_mode_golden_empty_hash_100ms.webm" ]; then
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
            echo "⚠️  Golden videos not found — skipping Cat Mode Video tests."
            echo "   Run 'npm run generate-golden-videos' to create test assets."
          fi

      - name: Setup Chrome
        if: steps.check_golden.outputs.exists == 'true'
        uses: browser-actions/setup-chrome@latest # v1.7.1+
        with:
          chrome-version: stable

      - name: Install Python dependencies for test runner
        if: steps.check_golden.outputs.exists == 'true'
        run: |
          pip install selenium
          # Selenium Manager (built into selenium >=4.6) auto-resolves a
          # chromedriver matching the installed Chrome.
          echo "CHROME_BIN=$(which google-chrome || which chrome)" >> $GITHUB_ENV

      - name: Verify golden video checksums
        if: steps.check_golden.outputs.exists == 'true'
        run: |
          cd tests/golden
          echo "✓ Golden videos present"

      - name: Run Cat Mode Golden Video Test
        if: steps.check_golden.outputs.exists == 'true'
        run: |
          cd tests
          python3 run_golden_test.py

  # ═══════════════════════════════════════════════════════════════════════════
  # GATE 3: Cat Mode Error Injection Testing (validates error handling)
  # ═══════════════════════════════════════════════════════════════════════════
  cat-mode-error-test:
    name: "Gate 3: Cat Mode Error Tests"
    needs: cat-mode-golden-test
    if: always() # Run even if Gate 2 fails
    runs-on: ubuntu-latest
    timeout-minutes: 20
    continue-on-error: true # Allow CI to proceed even if this gate fails

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "20"
          cache: "npm"

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          sudo apt-get install -y chromium-browser || true

      - name: Install npm dependencies
        run: npm install

      - name: Check if error videos exist
        id: check_errors
        run: |
          if [ -d "tests/golden/errors" ] && [ -f "tests/golden/errors/manifest.json" ]; then
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
          fi

      - name: Generate error videos (if missing)
        if: steps.check_errors.outputs.exists == 'false'
        run: |
          # Generate golden videos first (if they don't exist)
          if [ ! -f "tests/golden/cat_mode_golden_empty_hash_100ms.webm" ]; then
            echo "📹 Generating golden videos first..."
            npm run generate-golden-videos
          fi

          echo "🧪 Generating error test videos..."
          npm run generate-error-tests

      - name: Verify error video checksums
        if: steps.check_errors.outputs.exists == 'true'
        run: |
          cd tests/golden/errors

          # Extract checksums from README and verify
          # (For now, just check files exist)
          if ls *.webm 1> /dev/null 2>&1; then
            echo "✅ Error videos found"
            ls -lh *.webm
          else
            echo "⚠️ No error videos found - regenerating"
            cd ../../..
            npm run generate-error-tests
          fi

      - name: Run Error Injection Tests
        run: |
          cd tests
          python3 run_error_tests.py

      - name: Upload error diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: error-test-results
          path: tests/golden/errors/test_results.json
          retention-days: 30

  # ═══════════════════════════════════════════════════════════════════════════
  # GATE 4: Cross-Browser Testing (validates multi-browser compatibility)
  # ═══════════════════════════════════════════════════════════════════════════
  cat-mode-cross-browser:
    name: "Gate 4: Cross-Browser Tests"
    needs: cat-mode-golden-test
    if: always() # Run even if Gate 2 fails
    runs-on: ubuntu-latest
    timeout-minutes: 30
    continue-on-error: true # Allow CI to proceed even if this gate fails

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "20"
          cache: "npm"

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"

      - name: Install npm dependencies
        run: npm install

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium firefox webkit

      - name: Check if golden videos exist
        id: check_golden
        run: |
          if [ -f "tests/golden/cat_mode_golden_empty_hash_100ms.webm" ]; then
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
          fi

      - name: Generate golden videos (if missing)
        if: steps.check_golden.outputs.exists == 'false'
        run: |
          sudo apt-get install -y ffmpeg
          npm run generate-golden-videos

      - name: Run cross-browser tests
        run: npm run test:browsers

      - name: Upload test artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report
          path: tests/playwright-report/
          retention-days: 30

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-results
          path: tests/playwright-results.json
          retention-days: 30

  # Gating loop-closure test: browser pixels -> Python QR/fountain decoder.
  cat-mode-optical:
    name: "Gate 4b: Cat Mode Optical Loop"
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "20"
          cache: "npm"

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install optical decoder dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libzbar0 libgl1 libglib2.0-0
          python -m pip install -e ".[dev]"

      - uses: dtolnay/rust-toolchain@d0592fe69e35bc8f12e3dbaf9ad2694d976cb8e3 # stable
        with:
          toolchain: stable

      - name: Build and install Rust crypto backend
        # RUST_BACKEND_REQUIRED=1 (workflow env) makes pytest exit unless
        # the meow_crypto_rs wheel is importable.
        run: |
          python -m pip install "maturin==1.14.1"
          cd rust_crypto && maturin build --release --out dist && pip install --force-reinstall --no-deps dist/*.whl && cd ..

      - name: Install browser harness
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Run Cat Mode optical loop
        env:
          MEOW_CAT_CAPTURE_DIR: test-results/cat-mode
        run: make test-cat-mode

      - name: Upload Cat Mode optical frames
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cat-mode-optical-frames
          path: test-results/cat-mode/
          retention-days: 14

  # ═══════════════════════════════════════════════════════════════════════════
  # GATE 5: Security coverage (only runs after preflight passes)
  # ═══════════════════════════════════════════════════════════════════════════
  security-coverage:
    name: "Gate 5: Security Coverage - ${{ matrix.shard_name }}"
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 30
    continue-on-error: true # Non-blocking: coverage tracking, not a merge gate
    strategy:
      fail-fast: false
      matrix:
        include:
          - shard_name: Shard 1/3 - security core
            shard_id: 1
          - shard_name: Shard 2/3 - crypto boundary
            shard_id: 2
          - shard_name: Shard 3/3 - cleanup and hardening
            shard_id: 3

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libzbar0 libgl1 libglib2.0-0 \
            build-essential pkg-config libssl-dev \
            libpcsclite-dev libudev-dev

      - uses: dtolnay/rust-toolchain@d0592fe69e35bc8f12e3dbaf9ad2694d976cb8e3 # stable
        with:
          toolchain: stable

      - name: Install Python + Rust backend
        # Local wheel install - can't hash-pin freshly-built artifacts
        run: |
          pip install --require-hashes -r requirements-pip.lock
          pip install --require-hashes -r requirements.lock
          pip install --require-hashes -r requirements-dev.lock
          pip install --require-hashes -r requirements-ci.lock
          cd rust_crypto && maturin build --release --out dist && pip install --force-reinstall --no-deps dist/*.whl && cd ..

      - name: Security coverage shard
        run: |
          # 2026-05-04 Gate 5 expansion: added the test files below to each
          # shard after auditing which existing tests actually exercise the
          # under-covered security modules but weren't being run under
          # `--cov-config=.coveragerc-security`. Local measurement on
          # `audit/cat-mode-fixes` shows TOTAL coverage rises from
          # ~65% → 64-77% per module across the include set after these
          # additions (master_ratchet 45%→77%, schrodinger_encode 0%→40%,
          # manifest_signing 63%→64%, pq_hybrid 69%→70%). The 85%
          # aspirational target stays in `.coveragerc-security` but
          # `--cov-fail-under=0` keeps the gate non-blocking on the actual
          # number until OS-specific code in memory_guard.py (412 lines,
          # 27% in Linux CI) gets either tested or trimmed from the
          # include list.
          case "${{ matrix.shard_id }}" in
            1)
              pytest \
                --override-ini="addopts=" \
                --cov --cov-config=.coveragerc-security \
                --cov-report=term-missing \
                --cov-fail-under=0 \
                -q --no-header \
                tests/test_adversarial.py \
                tests/test_stego_adversarial.py \
                tests/test_security_crypto.py \
                tests/test_security_frame_mac.py \
                tests/test_security_manifest.py \
                tests/test_high_security_mode.py \
                tests/test_high_security_extras.py \
                tests/test_high_security_boost.py \
                tests/test_security_hardening.py \
                tests/test_security_warnings.py \
                tests/test_phase5_modules.py \
                tests/test_audit_fixes.py \
                tests/test_property_ratchet_pq.py \
                tests/test_schrodinger_dos.py \
                tests/test_formal_fuzz_gaps_fountain.py \
                tests/test_formal_fuzz_gaps_tamper.py \
                tests/security/test_air_gap.py \
                tests/security/test_ci_distinguishability.py \
                tests/security/test_decorrelation.py \
                tests/security/test_deniability.py \
                tests/security/test_dual_stream.py \
                tests/security/test_expiry.py
              ;;
            2)
              pytest \
                --override-ini="addopts=" \
                --cov --cov-config=.coveragerc-security \
                --cov-report=term-missing \
                --cov-fail-under=0 \
                -q --no-header \
                tests/test_crypto.py \
                tests/test_crypto_DEBUG.py \
                tests/test_crypto_backend.py \
                tests/test_rust_crypto_backend.py \
                tests/test_pq_crypto_real.py \
                tests/test_pq_hybrid.py \
                tests/test_pqxdh_upgrade.py \
                tests/test_constant_time.py \
                tests/test_e2e_crypto_fountain.py \
                tests/test_x25519_forward_secrecy.py \
                tests/test_timelock_duress.py \
                tests/test_ratchet.py \
                tests/security/test_nonce_uniqueness.py \
                tests/security/test_ratchet_forward_secrecy.py \
                tests/security/test_timing_equalizer.py
              ;;
            3)
              pytest \
                --override-ini="addopts=" \
                --cov --cov-config=.coveragerc-security \
                --cov-report=term-missing \
                --cov-fail-under=0 \
                -q --no-header \
                tests/security/test_secure_temp.py \
                tests/security/test_secure_input.py \
                tests/security/test_source_cleanup.py \
                tests/security/test_forensic_cleanup.py \
                tests/security/test_memory_guard.py \
                tests/security/test_size_normalizer.py \
                tests/security/test_dontdump.py
              ;;
            *)
              echo "Unknown security coverage shard: ${{ matrix.shard_id }}"
              exit 1
              ;;
          esac

  # ═══════════════════════════════════════════════════════════════════════════
  # GATE 6: Slow Tests (Monte Carlo stress tests for fountain codes)
  # Validates statistical guarantees of LT codes - runs 1000s of trials
  # ═══════════════════════════════════════════════════════════════════════════
  slow-tests:
    name: "Gate 6: Slow Tests - ${{ matrix.shard_name }}"
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - shard_name: Shard 1/3 - 30 percent loss
            shard_id: 1
          - shard_name: Shard 2/3 - 50 percent loss
            shard_id: 2
          - shard_name: Shard 3/3 - extremes and edge cases
            shard_id: 3

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libzbar0 libgl1 libglib2.0-0 \
            build-essential pkg-config libssl-dev \
            libpcsclite-dev libudev-dev

      - uses: dtolnay/rust-toolchain@d0592fe69e35bc8f12e3dbaf9ad2694d976cb8e3 # stable
        with:
          toolchain: stable

      - name: Install Python dependencies
        run: |
          pip install --require-hashes -r requirements-pip.lock
          pip install --require-hashes -r requirements.lock
          pip install --require-hashes -r requirements-dev.lock
          pip install --require-hashes -r requirements-ci.lock

      - name: Build and install Rust crypto backend
        run: |
          cd rust_crypto
          maturin build --release --out dist
          python -m pip install --force-reinstall --no-deps dist/*.whl
          cd ..

      - name: Run slow test shard (Monte Carlo fountain stress)
        run: |
          case "${{ matrix.shard_id }}" in
            1)
              echo "🎲 Running 30% loss Monte Carlo shard"
              pytest -m slow tests/test_fountain_montecarlo.py \
                --override-ini="addopts=" \
                -v --tb=short \
                -k "TestMonteCarlo30PercentLoss"
              ;;
            2)
              echo "🎲 Running 50% loss Monte Carlo shard"
              pytest -m slow tests/test_fountain_montecarlo.py \
                --override-ini="addopts=" \
                -v --tb=short \
                -k "TestMonteCarlo50PercentLoss"
              ;;
            3)
              echo "🎲 Running extreme-loss and edge-case Monte Carlo shard"
              pytest -m slow tests/test_fountain_montecarlo.py \
                --override-ini="addopts=" \
                -v --tb=short \
                -k "TestMonteCarloExtreme or TestStatisticalProperties or TestFrameReorderAndDuplicates or TestEdgeCases"
              ;;
            *)
              echo "Unknown slow-test shard: ${{ matrix.shard_id }}"
              exit 1
              ;;
          esac

  # ═══════════════════════════════════════════════════════════════════════════
  # Required status check — preflight + all gates must pass
  # ═══════════════════════════════════════════════════════════════════════════
  all-gates:
    name: "All CI Gates"
    needs:
      [
        preflight,
        test-batch-1,
        test-batch-2,
        test-batch-3,
        cat-mode-golden-test,
        cat-mode-error-test,
        cat-mode-cross-browser,
        security-coverage,
        slow-tests,
      ]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: always()
    steps:
      - name: Check gate results
        run: |
          FAILED=0

          if [[ "${{ needs.preflight.result }}" != "success" ]]; then
            echo "❌ Preflight (Lint + Lock Check) failed"
            FAILED=1
          fi
          if [[ "${{ needs.test-batch-1.result }}" != "success" ]]; then
            echo "❌ Gate 1a (Tests Batch 1) failed"
            FAILED=1
          fi
          if [[ "${{ needs.test-batch-2.result }}" != "success" ]]; then
            echo "❌ Gate 1b (Tests Batch 2) failed"
            FAILED=1
          fi
          if [[ "${{ needs.test-batch-3.result }}" != "success" ]]; then
            echo "❌ Gate 1c (Tests Batch 3) failed"
            FAILED=1
          fi
          # Gates 2-4 are Cat Mode video tests - treat as warnings (continue-on-error)
          if [[ "${{ needs.cat-mode-golden-test.result }}" != "success" ]]; then
            echo "⚠️  Gate 2 (Cat Mode Golden Video) had issues (non-blocking)"
          fi
          if [[ "${{ needs.cat-mode-error-test.result }}" != "success" ]]; then
            echo "⚠️  Gate 3 (Cat Mode Error Tests) had issues (non-blocking)"
          fi
          if [[ "${{ needs.cat-mode-cross-browser.result }}" != "success" ]]; then
            echo "⚠️  Gate 4 (Cross-Browser Tests) had issues (non-blocking)"
          fi
          # Gate 5 is tracked as a warning (coverage target, not merge gate)
          if [[ "${{ needs.security-coverage.result }}" != "success" ]]; then
            echo "⚠️  Gate 5 (Security Coverage) below target (non-blocking)"
          fi
          if [[ "${{ needs.slow-tests.result }}" != "success" ]]; then
            echo "❌ Gate 6 (Slow Tests - Monte Carlo) failed"
            FAILED=1
          fi

          if [[ "$FAILED" == "1" ]]; then
            echo "❌ Some critical CI gates failed"
            exit 1
          fi
          echo "✅ All critical CI gates passed"
