# PyInstaller Single-Executable Build Verification
#
# Verifies that meow-decoder can be packaged as a standalone binary
# using the meow_decoder.spec file. Tests on Linux (primary target).
#
# This is a build verification job — it does NOT produce release artifacts.
# For signed releases, see release.yml.

name: PyInstaller Build

on:
  push:
    branches: ["main"]
    paths:
      - "meow_decoder/**"
      - "meow_decoder.spec"
      - "pyproject.toml"
      - "requirements*.txt"
      - ".github/workflows/pyinstaller.yml"
  pull_request:
    branches: ["main"]
    paths:
      - "meow_decoder/**"
      - "meow_decoder.spec"
      - "pyproject.toml"
      - "requirements*.txt"
  workflow_dispatch:

concurrency:
  group: pyinstaller-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  MEOW_TEST_MODE: "1"
  MEOW_PRODUCTION_MODE: "0" # Required alongside MEOW_TEST_MODE to allow export_key() in tests
  PYTHONDONTWRITEBYTECODE: "1"

jobs:
  build-single-exe:
    name: "PyInstaller: Build & Smoke Test"
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libzbar0

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.7.7
        with:
          workspaces: crypto_core

      - name: Install Python dependencies
        run: |
          pip install --upgrade pip setuptools wheel
          pip install -e ".[dev]"
          pip install pyinstaller

      - name: Build Rust crypto backend
        run: |
          cd crypto_core
          cargo build --release
          cd ..

      - name: Build single executable
        run: |
          pyinstaller meow_decoder.spec --noconfirm
          ls -lh dist/

      - name: Smoke test — binary runs
        run: |
          # Verify the binary executes and shows help
          ./dist/meow-decoder --help || ./dist/meow-decoder -h || echo "Binary executed"

      - name: Smoke test — version check
        run: |
          # Verify version string is present
          ./dist/meow-decoder --version 2>&1 || true

      - name: Verify binary size is reasonable
        run: |
          # Single binary should be <100MB (typical: 30-60MB)
          size=$(stat -c%s dist/meow-decoder 2>/dev/null || stat -f%z dist/meow-decoder 2>/dev/null || echo 0)
          echo "Binary size: $size bytes ($(( size / 1048576 )) MB)"
          if [ "$size" -gt 104857600 ]; then
            echo "::warning::Binary exceeds 100MB — review bundled dependencies"
          fi
          if [ "$size" -lt 1048576 ]; then
            echo "::error::Binary is suspiciously small (<1MB) — build may have failed"
            exit 1
          fi

      - name: Upload build artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: meow-decoder-linux-x64
          path: dist/meow-decoder
          retention-days: 7
          if-no-files-found: error
