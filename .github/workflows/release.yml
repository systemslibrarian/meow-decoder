# Signed Release Workflow
# Creates signed releases with Sigstore cosign for supply chain security
# Improves OpenSSF Scorecard "Signed-Releases" metric
#
# NOTE: This workflow publishes the Python package (meow-decoder).
# Rust extension wheels (meow_crypto_rs) are published separately
# by the rust-crypto.yml workflow on release events.

name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version tag (e.g., v1.0.0)"
        required: true
        type: string

permissions: read-all

jobs:
  build:
    name: Build Release Artifacts
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read

    outputs:
      hashes: ${{ steps.hash.outputs.hashes }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"

      - name: Install build dependencies
        run: |
          pip install --require-hashes -r requirements-pip.lock
          pip install --require-hashes -r requirements-ci.lock

      - name: Build Python package
        run: |
          python -m build

      - name: Generate artifact hashes
        id: hash
        run: |
          cd dist
          echo "hashes=$(sha256sum * | base64 -w0)" >> "$GITHUB_OUTPUT"

      - name: Upload build artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: python-package
          path: dist/
          retention-days: 5

  provenance:
    name: Generate SLSA Provenance
    needs: [build]
    permissions:
      actions: read
      id-token: write
      contents: write
    uses: slsa-framework/slsa-github-generator/.github/workflows/generator_generic_slsa3.yml@v2.1.0
    with:
      base64-subjects: "${{ needs.build.outputs.hashes }}"
      upload-assets: true

  release:
    name: Create Signed Release
    needs: [build, provenance]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      id-token: write

    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: python-package
          path: dist/

      - name: Install cosign
        # Bumped from v3.7.0 → v4.1.1 to clear the dependabot upgrade
        # (PR #167). v4 of the installer DEFAULTS to installing Cosign
        # v3, which has a breaking change to `sign-blob` (requires a new
        # `--bundle` flag, drops `--output-signature`/`--output-certificate`
        # and produces a single `.bundle.json` instead of separate `.sig`
        # + `.pem`). To preserve the current sig output format and avoid
        # downstream verifier breakage, pin `cosign-release` back to
        # v2.6.1 — supported by installer v4 per the upstream release
        # notes ("You may still install Cosign v2.x with cosign-installer
        # v4"). When migrating to Cosign v3, drop this pin and update
        # the sign-blob call below.
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: 'v2.6.1'

      - name: Sign artifacts with Sigstore
        run: |
          for file in dist/*; do
            cosign sign-blob --yes "$file" --output-signature "${file}.sig" --output-certificate "${file}.pem"
          done

      - name: Create GitHub Release
        uses: softprops/action-gh-release@b4309332981a82ec1c5618f44dd2e27cc8bfbfda # v3.0.0
        with:
          files: |
            dist/*
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(github.ref, 'alpha') || contains(github.ref, 'beta') || contains(github.ref, 'rc') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
