# OpenSSF Scorecard - Security health metrics for the supply chain
# https://github.com/ossf/scorecard-action
# https://securityscorecards.dev/

name: OpenSSF Scorecard

on:
  # Run on pushes to main branch
  push:
    branches: ["main"]
  # Weekly scan (Sunday at 00:00 UTC)
  schedule:
    - cron: "0 0 * * 0"
  # Allow manual trigger
  workflow_dispatch:

# Minimal permissions - only what's required
permissions: read-all

jobs:
  analysis:
    name: Scorecard analysis
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      # Required for SARIF upload to GitHub Security tab
      security-events: write
      # Required for OIDC token to publish results to OpenSSF API
      id-token: write
      # Read repo contents
      contents: read
      # Read actions (for detecting pinned actions)
      actions: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Run OpenSSF Scorecard
        uses: ossf/scorecard-action@4eaacf0543bb3f2c246792bd56e8cdeffafb205a # v2.4.3
        with:
          results_file: results.sarif
          results_format: sarif
          # Publish results to OpenSSF API for public badge/viewer
          # Uses OIDC - no PAT required for public repos
          publish_results: true

      - name: Upload SARIF to GitHub Security tab
        uses: github/codeql-action/upload-sarif@b1bff81932f5cdfc8695c7752dcee935dcd061c8 # v4.33.0
        with:
          sarif_file: results.sarif

      - name: Upload Scorecard results as artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.0
        with:
          name: scorecard-results
          path: results.sarif
          retention-days: 5
