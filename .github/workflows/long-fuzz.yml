name: Long-Running Fuzzing (Weekly)

# Gap-10 fix: Dedicated long-duration fuzz for tamper-detection and
# other security-critical targets that require sustained runs to surface
# slow-triggering bugs (adversarial poisoning triggers, state-machine
# exhaustion, accumulative HMAC-bypass attempts).
#
# This workflow is intentionally SEPARATE from the main fuzz.yml CI gate
# (which uses 30-60 s per target).  Long runs are not suitable for every
# PR but must run on a regular schedule so we catch bugs before release.
#
# Targets covered (with justification for long-run requirement):
#   fuzz_tamper_detection.py   — adversarial poisoning triggers require ≥ 1000
#                                 iterations to reach state-machine edge cases
#   fuzz_crypto_backend.py     — Rust FFI memory bugs surface after many calls
#   fuzz_schrodinger.py        — dual-secret entropy checks need wide input space
#   fuzz_ratchet.py            — skip-key-cache overflow only visible at ≥ 2000 steps
#   fuzz_adversarial_stego.py  — rotation schedule exhaustion needs many frames
#
# Duration: 3600 s (1 hour) per target on scheduled run.
#           300 s per target on manual workflow_dispatch.

on:
  schedule:
    # Run long-form fuzzing every Sunday at 01:00 UTC
    # (fuzz.yml runs at 00:00 UTC, this starts after it finishes)
    - cron: "0 1 * * 0"
  workflow_dispatch:
    inputs:
      duration:
        description: "Duration in seconds per target (default: 300)"
        required: false
        default: "300"

permissions:
  contents: read
  # Allow writing security scan results
  security-events: write

jobs:
  long-fuzz-tamper:
    name: Long-Run Tamper Detection Fuzz
    runs-on: ubuntu-latest
    timeout-minutes: 90 # 1 h target + 30 min overhead

    env:
      MEOW_TEST_MODE: "1"
      MEOW_CRYPTO_BACKEND: rust

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.3.0
        with:
          python-version: "3.12"

      - uses: dtolnay/rust-toolchain@d0592fe69e35bc8f12e3dbaf9ad2694d976cb8e3 # stable
        with:
          toolchain: stable

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libzbar0 libgl1 libglib2.0-0 \
            build-essential pkg-config libssl-dev \
            libpcsclite-dev libudev-dev
          pip install --require-hashes -r requirements-pip.lock
          pip install --require-hashes -r requirements-ci.lock
          pip install --require-hashes -r requirements.lock
          pip install --require-hashes -r requirements-dev.lock || true
          pip install --no-deps -e .

      - name: Build and install Rust crypto backend
        run: |
          cd rust_crypto
          maturin build --release --out dist
          python -m pip install --force-reinstall --no-deps dist/*.whl
          cd ..

      - name: Create corpus directories
        run: |
          mkdir -p fuzz/corpus/manifest
          mkdir -p fuzz/corpus/qr
          mkdir -p fuzz/corpus/fountain
          mkdir -p fuzz/crashes

      - name: Seed corpus
        run: python fuzz/seed_corpus.py

      - name: Set duration
        id: dur
        run: |
          # 3600 on schedule, 300 on manual, custom if provided
          if [ "${{ github.event_name }}" = "schedule" ]; then
            echo "DURATION=3600" >> "$GITHUB_ENV"
          else
            echo "DURATION=${{ github.event.inputs.duration || '300' }}" >> "$GITHUB_ENV"
          fi

      # ── PRIMARY: Tamper detection (Gap-10 target) ─────────────────────
      - name: Long-fuzz tamper detection (adversarial poisoning)
        run: |
          echo "Running tamper detection fuzz for ${DURATION}s …"
          echo "This long-duration run surfaces slow-triggering adversarial"
          echo "poisoning, HMAC-bypass accumulation, and state-machine exhaustion."
          timeout "${DURATION}s" python fuzz/fuzz_tamper_detection.py \
            fuzz/corpus/manifest || RC=$?
          RC=${RC:-0}
          [ "$RC" -eq 0 ] || [ "$RC" -eq 124 ] || exit "$RC"
          echo "Tamper detection fuzz completed (RC=$RC)"

      # ── Crypto backend (Rust FFI memory safety) ───────────────────────
      - name: Long-fuzz crypto backend (Rust FFI)
        run: |
          timeout "${DURATION}s" python fuzz/fuzz_crypto_backend.py \
            fuzz/corpus/manifest || RC=$?
          RC=${RC:-0}
          [ "$RC" -eq 0 ] || [ "$RC" -eq 124 ] || exit "$RC"

      # ── Schrödinger (dual-secret entropy exhaustion) ──────────────────
      - name: Long-fuzz Schrödinger encode/decode
        run: |
          timeout "${DURATION}s" python fuzz/fuzz_schrodinger.py || RC=$?
          RC=${RC:-0}
          [ "$RC" -eq 0 ] || [ "$RC" -eq 124 ] || exit "$RC"

      # ── Ratchet (skip-key-cache overflow at ≥ 2000 steps) ─────────────
      - name: Long-fuzz ratchet (skip-key-cache depth)
        run: |
          timeout "${DURATION}s" python fuzz/fuzz_ratchet.py || RC=$?
          RC=${RC:-0}
          [ "$RC" -eq 0 ] || [ "$RC" -eq 124 ] || exit "$RC"

      # ── Adversarial stego (rotation schedule exhaustion) ──────────────
      - name: Long-fuzz adversarial stego rotation
        run: |
          timeout "${DURATION}s" python fuzz/fuzz_adversarial_stego.py || RC=$?
          RC=${RC:-0}
          [ "$RC" -eq 0 ] || [ "$RC" -eq 124 ] || exit "$RC"

      # ── Crash gate ────────────────────────────────────────────────────
      - name: Check for crashes
        run: |
          if [ -n "$(ls -A fuzz/crashes 2>/dev/null)" ]; then
            echo "🚨 Long-run fuzz found crashes!"
            ls -la fuzz/crashes/
            cat fuzz/crashes/* 2>/dev/null || true
            exit 1
          else
            echo "✅ No crashes found after long-run fuzzing"
          fi

      - name: Upload crash artifacts
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.0
        with:
          name: long-fuzz-crashes-${{ github.run_id }}
          path: fuzz/crashes/
          retention-days: 90 # Keep longer than short-run crashes

      - name: Upload corpus (for corpus sharing with main fuzz.yml)
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.0
        with:
          name: long-fuzz-corpus-${{ github.run_id }}
          path: fuzz/corpus/
          retention-days: 14
