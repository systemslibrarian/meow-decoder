# Formal Verification Workflow
# Runs the full formal verification suite: ProVerif, TLA+ (all 3 models),
# Lean 4 (build + sorry gate), Tamarin (Docker), Verus (Docker),
# and Tamarin PQ negative tests.
#
# Triggered on:
#   - Push to main/develop that modifies formal/ directory
#   - Pull requests that modify formal/ directory
#   - Manual workflow dispatch
#   - Weekly schedule (comprehensive verification)

name: Formal Verification

on:
  push:
    branches: [main, develop]
    paths:
      - "formal/**"
      - "crypto_core/src/verus*"
      - "crypto_core/src/lib.rs"
      - "crypto_core/src/aead.rs"
      - "meow_decoder/crypto.py"
      - "meow_decoder/crypto_enhanced.py"
      - "meow_decoder/ratchet.py"
      - "meow_decoder/pq_hybrid.py"
      - "meow_decoder/pq_ratchet_beacon.py"
      - "meow_decoder/forward_secrecy.py"
      - "meow_decoder/x25519_forward_secrecy.py"
      - "meow_decoder/schrodinger_encode.py"
      - "meow_decoder/encode.py"
      - "meow_decoder/decode_gif.py"
      - ".github/workflows/formal-verification.yml"
      # F-04: expanded trigger surface for all formally-modelled modules
      - "crypto_core/src/secure_alloc.rs"
      - "crypto_core/src/aead_wrapper.rs"
      - "crypto_core/src/pure_crypto.rs"
      - "meow_decoder/constant_time.py"
      - "meow_decoder/quantum_mixer.py"
      - "meow_decoder/fountain.py"
  pull_request:
    paths:
      - "formal/**"
      - "crypto_core/src/verus*"
      - "crypto_core/src/lib.rs"
      - "crypto_core/src/aead.rs"
      - "meow_decoder/crypto.py"
      - "meow_decoder/crypto_enhanced.py"
      - "meow_decoder/ratchet.py"
      - "meow_decoder/pq_hybrid.py"
      - "meow_decoder/pq_ratchet_beacon.py"
      - "meow_decoder/forward_secrecy.py"
      - "meow_decoder/x25519_forward_secrecy.py"
      - "meow_decoder/schrodinger_encode.py"
      - "meow_decoder/encode.py"
      - "meow_decoder/decode_gif.py"
      - ".github/workflows/formal-verification.yml"
      # F-04: expanded trigger surface for all formally-modelled modules
      - "crypto_core/src/secure_alloc.rs"
      - "crypto_core/src/aead_wrapper.rs"
      - "crypto_core/src/pure_crypto.rs"
      - "meow_decoder/constant_time.py"
      - "meow_decoder/quantum_mixer.py"
      - "meow_decoder/fountain.py"
  workflow_dispatch:
    inputs:
      verbose:
        description: "Show attack traces for failed queries"
        required: false
        default: "false"
        type: boolean
  schedule:
    # Weekly comprehensive verification on Sunday at 4 AM UTC (staggered from rust-security-suite)
    - cron: "0 4 * * 0"

permissions:
  contents: read

jobs:
  proverif:
    name: ProVerif - ${{ matrix.shard_name }}
    permissions:
      contents: read
      pull-requests: write # Required for PR comment on failure
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - shard_name: Shard 1/3 - core model
            shard_id: 1
            shard_key: shard-1-of-3
          - shard_name: Shard 2/3 - negative + extra A
            shard_id: 2
            shard_key: shard-2-of-3
          - shard_name: Shard 3/3 - extra B
            shard_id: 3
            shard_key: shard-3-of-3

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install ProVerif
        run: |
          set -e
          sudo apt-get update

          # Ubuntu 24.04 (ubuntu-latest) does NOT ship ProVerif in its apt repos.
          # ProVerif is NOT on the Ubuntu 24.04 apt mirror, so we always fall
          # through to the source build. The source build uses OCaml without the
          # optional lablgtk2 GUI library, which produces the command-line binary.
          if sudo apt-get install -y proverif 2>/dev/null; then
            echo "ProVerif installed from apt"
          else
            echo "Building ProVerif 2.05 from source (expected on Ubuntu 24.04)..."
            # ocaml-native-compilers provides ocamlopt for fast native builds.
            # ocaml-findlib provides ocamlfind used by ./build.
            sudo apt-get install -y ocaml ocaml-native-compilers ocaml-findlib

            PROVERIF_URL="https://bblanche.gitlabpages.inria.fr/proverif/proverif2.05.tar.gz"
            wget -q "$PROVERIF_URL" -O /tmp/proverif.tar.gz
            tar xzf /tmp/proverif.tar.gz -C /tmp/
            cd /tmp/proverif2.05

            # ./build detects the absence of lablgtk2 and builds only the
            # command-line proverif binary (not proverifinter).
            # Note: ./build may exit non-zero when the optional lablgtk2 GUI
            # package is missing. This is harmless — the CLI binary is still
            # produced. We capture the exit code and check for the binary.
            set +e
            ./build 2>&1
            BUILD_EXIT=$?
            set -e

            # Hard-fail if the binary was not produced.
            if [ ! -f proverif ]; then
              echo "ERROR: proverif binary not found after ./build (exit $BUILD_EXIT)"
              exit 1
            fi
            echo "ProVerif CLI binary built successfully (build exit=$BUILD_EXIT)."
            sudo cp proverif /usr/local/bin/proverif
            cd -
          fi

          # Verify installation succeeded. This must not have a || fallback;
          # if it fails, the ProVerif job should fail rather than run silently
          # without a working tool and report false success.
          # Note: ProVerif 2.05 does not support -version; use -help instead.
          proverif -help 2>&1 | head -5

      - name: Run ProVerif shard
        run: |
          cd formal/proverif

          run_additional_model() {
            local model="$1"
            local outfile="extra_${model%.pv}.txt"
            if [ ! -f "$model" ]; then
              echo "⚠️  $model not found, skipping"
              return 0
            fi

            echo ""
            echo "--- Checking $model ---"
            set +e
            proverif "$model" 2>&1 | tee "$outfile"
            local pv_exit=$?
            set -e

            if grep -q "RESULT.*is false" "$outfile"; then
              echo "❌ $model: query falsified — potential security issue"
              return 1
            fi

            if [ "$pv_exit" -ne 0 ]; then
              echo "⚠️  $model: ProVerif returned exit $pv_exit (may be non-fatal)"
            else
              passed_queries=$(grep -c "is true" "$outfile" || echo 0)
              echo "✅ $model: $passed_queries queries verified"
            fi
          }

          case "${{ matrix.shard_id }}" in
            1)
              echo "============================================"
              echo "🔐 Running ProVerif Security Analysis"
              echo "============================================"
              echo ""

              set +e
              proverif meow_encode.pv 2>&1 | tee proverif_output.txt
              PROVERIF_EXIT=$?
              set -e

              echo ""
              echo "============================================"
              echo "📊 Verification Summary"
              echo "============================================"

              PASSED=$(grep -c "is true" proverif_output.txt || echo "0")
              FAILED=$(grep -c "is false" proverif_output.txt || echo "0")
              CANNOT=$(grep -c "cannot be proved" proverif_output.txt || echo "0")

              echo "✅ Verified (true): $PASSED"
              echo "❌ Failed (false): $FAILED"
              echo "⚠️  Could not prove: $CANNOT"
              echo ""

              CRITICAL_FAILURES=0

              if grep -q "Query not attacker(real_secret" proverif_output.txt; then
                if ! grep -q "Query not attacker(real_secret.*is true" proverif_output.txt; then
                  echo "❌ CRITICAL: Real secret secrecy violated!"
                  CRITICAL_FAILURES=$((CRITICAL_FAILURES + 1))
                fi
              fi

              if grep -q "Query not attacker(real_password" proverif_output.txt; then
                if ! grep -q "Query not attacker(real_password.*is true" proverif_output.txt; then
                  echo "❌ CRITICAL: Password secrecy violated!"
                  CRITICAL_FAILURES=$((CRITICAL_FAILURES + 1))
                fi
              fi

              if grep -q "DuressPasswordUsed.*DecoderOutputReal.*is false" proverif_output.txt; then
                echo "❌ CRITICAL: Duress mode outputs real secret!"
                CRITICAL_FAILURES=$((CRITICAL_FAILURES + 1))
              fi

              if grep -q "DecoderOutputReal.*DecoderAuthenticated.*is false" proverif_output.txt; then
                echo "❌ CRITICAL: Output without authentication!"
                CRITICAL_FAILURES=$((CRITICAL_FAILURES + 1))
              fi

              if [ "$CRITICAL_FAILURES" -gt 0 ]; then
                echo ""
                echo "⚠️  $CRITICAL_FAILURES critical security properties failed!"
                exit 1
              fi

              echo ""
              echo "ℹ️  Session correspondence queries may show FALSE - this is expected"
              echo "   for multi-session models. See meow_encode.pv for documentation."
              echo ""
              echo "✅ All critical security properties verified!"

              mkdir -p html_output
              proverif -html html_output meow_encode.pv || true

              if [ "$PROVERIF_EXIT" -ne 0 ]; then
                echo "⚠️  ProVerif core model exited with $PROVERIF_EXIT"
              fi
              ;;
            2)
              echo "============================================"
              echo "🔴 ProVerif negative replay test + extra models A"
              echo "============================================"
              set +e
              proverif meow_encode_NEGATIVE_ReplayNoCounterCheck.pv 2>&1 | tee proverif_neg_output.txt
              set -e
              echo "✅ ProVerif negative test completed (documents replay vulnerability)"
              run_additional_model pq_beacon_pcs.pv
              run_additional_model manifest_signing.pv
              ;;
            3)
              echo "============================================"
              echo "🔐 ProVerif extra models B"
              echo "============================================"
              run_additional_model deadmans_switch_duress.pv
              run_additional_model meow_aad_8field_binding.pv
              ;;
            *)
              echo "Unknown ProVerif shard: ${{ matrix.shard_id }}"
              exit 1
              ;;
          esac

      - name: Upload ProVerif Results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: proverif-results-${{ matrix.shard_key }}
          path: |
            formal/proverif/proverif_output.txt
            formal/proverif/proverif_neg_output.txt
            formal/proverif/extra_*.txt
            formal/proverif/html_output/
          if-no-files-found: ignore
          retention-days: 30

      - name: Comment on PR (if failed)
        if: failure() && github.event_name == 'pull_request' && matrix.shard_id == 1
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const fs = require('fs');
            const output = fs.readFileSync('formal/proverif/proverif_output.txt', 'utf8');

            // Extract failed queries
            const failedLines = output.split('\n')
              .filter(line => line.includes('is false') || line.includes('cannot be proved'))
              .join('\n');

            const body = '## ⚠️ ProVerif Security Analysis Failed\n' +
              '\nThe following security properties could not be verified:\n' +
              '\n```\n' + failedLines + '\n```\n' +
              '\nThis indicates a potential security issue in the protocol design.\n' +
              'Please review the changes and ensure cryptographic properties are maintained.';

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: body
            });

  tlaplus:
    name: TLA+ - ${{ matrix.shard_name }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - shard_name: Shard 1/3 - core models
            shard_id: 1
            shard_key: shard-1-of-3
          - shard_name: Shard 2/3 - auxiliary models A
            shard_id: 2
            shard_key: shard-2-of-3
          - shard_name: Shard 3/3 - auxiliary models B
            shard_id: 3
            shard_key: shard-3-of-3

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Java
        uses: actions/setup-java@1bcf9fb12cf4aa7d266a90ae39939e61372fe520 # v5.4.0
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Download TLA+ Tools
        run: |
          mkdir -p formal/tla
          curl -sL -o formal/tla/tla2tools.jar \
            https://github.com/tlaplus/tlaplus/releases/download/v1.8.0/tla2tools.jar
          echo "Downloaded tla2tools.jar ($(wc -c < formal/tla/tla2tools.jar) bytes)"

      - name: Run TLA+ shard
        run: |
          cd formal/tla

          FAILED=0

          run_tlc() {
            local SPEC="$1"
            local CFG="$2"
            local LABEL="$3"
            local OUTFILE="$4"
            echo ""
            echo "📋 Checking $SPEC..."
            java -jar tla2tools.jar \
              -config "$CFG" \
              -workers auto \
              -deadlock \
              "$SPEC" 2>&1 | tee "$OUTFILE"

            if grep -qE "(No error has been found|Model checking completed\. No error)" "$OUTFILE"; then
              echo "✅ $LABEL: No invariant violations found"
            else
              echo "❌ $LABEL: Model checking found issues"
              FAILED=1
            fi
          }

          echo "============================================"
          echo "🔍 Running TLA+ Model Checking"
          echo "============================================"
          echo ""

          case "${{ matrix.shard_id }}" in
            1)
              run_tlc MeowEncode.tla MeowEncode.cfg "MeowEncode" tlc_encode_output.txt
              run_tlc MeowFountain.tla MeowFountain.cfg "MeowFountain" tlc_fountain_output.txt
              run_tlc MeowStreaming.tla MeowStreaming.cfg "MeowStreaming" tlc_streaming_output.txt
              ;;
            2)
              run_tlc TimingEqualizer.tla TimingEqualizer.cfg "TimingEqualizer" tlc_timing_output.txt
              run_tlc MeowRatchet.tla MeowRatchet.cfg "MeowRatchet" tlc_ratchet_output.txt
              ;;
            3)
              run_tlc ExpiryProtocol.tla ExpiryProtocol.cfg "ExpiryProtocol" tlc_expiry_output.txt
              run_tlc MasterRatchet.tla MasterRatchet.cfg "MasterRatchet" tlc_master_output.txt
              ;;
            *)
              echo "Unknown TLA+ shard: ${{ matrix.shard_id }}"
              exit 1
              ;;
          esac

          cat tlc_*_output.txt > tlc_output.txt

          echo ""
          echo "============================================"
          echo "📊 TLC Summary"
          echo "============================================"

          if [ "$FAILED" -eq 0 ]; then
            echo "✅ All TLA+ models verified successfully"
          else
            echo "❌ Some TLA+ models failed verification"
            exit 1
          fi

      - name: Upload TLA+ Results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: tla-results-${{ matrix.shard_key }}
          path: |
            formal/tla/tlc_output.txt
            formal/tla/tlc_encode_output.txt
            formal/tla/tlc_fountain_output.txt
            formal/tla/tlc_streaming_output.txt
            formal/tla/tlc_timing_output.txt
            formal/tla/tlc_ratchet_output.txt
            formal/tla/tlc_expiry_output.txt
            formal/tla/tlc_master_output.txt
          if-no-files-found: ignore
          retention-days: 30

  lean:
    name: Lean 4 - ${{ matrix.shard_name }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - shard_name: Shard 1/3 - Fountain proofs
            shard_id: 1
            shard_key: shard-1-of-3
          - shard_name: Shard 2/3 - Domain proofs
            shard_id: 2
            shard_key: shard-2-of-3
          - shard_name: Shard 3/3 - Shamir + sorry gate
            shard_id: 3
            shard_key: shard-3-of-3

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install elan (Lean toolchain manager)
        run: |
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> $GITHUB_PATH

      - name: Cache elan toolchain and lake packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.elan
            formal/lean/.lake
          key: lean-${{ hashFiles('formal/lean/lean-toolchain', 'formal/lean/lakefile.lean', 'formal/lean/lake-manifest.json') }}
          restore-keys: |
            lean-

      - name: Run Lean shard
        run: |
          cd formal/lean
          echo "============================================"
          echo "🔷 Running Lean 4 shard"
          echo "============================================"

          case "${{ matrix.shard_id }}" in
            1)
              lake env lean FountainCodes.lean 2>&1 | tee lean_build_output.txt
              ;;
            2)
              lake env lean Assumptions.lean 2>&1 | tee lean_assumptions_output.txt
              lake env lean DomainSeparation.lean 2>&1 | tee lean_domain_output.txt
              ;;
            3)
              lake env lean ShamirSecretSharing.lean 2>&1 | tee lean_shamir_output.txt
              echo "============================================"
              echo "🔷 Lean Sorry Gate — checking for unapproved sorry"
              echo "============================================"
              SORRY_COUNT=$(grep -rn '\bsorry\b' . --include='*.lean' \
                --exclude-dir='.lake' --exclude-dir='lake-packages' \
                | grep -v -e 'AXIOM:' -e 'APPROVED:' -e ':[[:blank:]]*--' -e ':[[:blank:]]*/--' \
                | grep -v -i -e '`sorry`' -e "sorry instance" -e "sorry statement" \
                -e "sorry tag" -e "approved sorry" -e "sorry for" \
                | wc -l)

              if [ "$SORRY_COUNT" -gt 0 ]; then
                echo "❌ Found $SORRY_COUNT unapproved sorry statement(s):"
                grep -rn '\bsorry\b' . --include='*.lean' \
                  --exclude-dir='.lake' --exclude-dir='lake-packages' \
                  | grep -v -e 'AXIOM:' -e 'APPROVED:' -e ':[[:blank:]]*--' -e ':[[:blank:]]*/--' \
                  | grep -v -i -e '`sorry`' -e "sorry instance" -e "sorry statement" \
                  -e "sorry tag" -e "approved sorry" -e "sorry for"
                exit 1
              else
                echo "✅ No unapproved sorry statements found."
              fi
              ;;
            *)
              echo "Unknown Lean shard: ${{ matrix.shard_id }}"
              exit 1
              ;;
          esac

      - name: Upload Lean Results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: lean-results-${{ matrix.shard_key }}
          path: |
            formal/lean/lean_build_output.txt
            formal/lean/lean_assumptions_output.txt
            formal/lean/lean_domain_output.txt
            formal/lean/lean_shamir_output.txt
          if-no-files-found: ignore
          retention-days: 30

  tamarin:
    name: Tamarin - ${{ matrix.shard_name }}
    runs-on: ubuntu-latest
    timeout-minutes: 330
    strategy:
      fail-fast: false
      matrix:
        include:
          - shard_name: Shard 1/3 - core proofs
            shard_id: 1
            shard_key: shard-1-of-3
          - shard_name: Shard 2/3 - critical models A
            shard_id: 2
            shard_key: shard-2-of-3
          - shard_name: Shard 3/3 - critical models B + auxiliary
            shard_id: 3
            shard_key: shard-3-of-3

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build Tamarin Docker image
        run: docker build -f formal/Dockerfile.tamarin -t meow-tamarin .

      - name: Run Tamarin shard
        run: |
          run_negative_test() {
            local label="$1"
            local outfile="$2"
            shift 2

            echo ""
            echo "$label"
            set +e
            # --memory=6g --cpus=2 mirrors the shard 1 entrypoint hardening;
            # negative tests still produce useful output below the cap and
            # don't kill the runner if Tamarin's heap blows up.
            timeout 1800 docker run --rm --memory=6g --cpus=2 \
              meow-tamarin sh -c "$*" 2>&1 | tee "$outfile"
            local exit_code=$?
            set -e

            if [ "$exit_code" -ne 0 ]; then
              echo "✅ $label failed as expected (exit $exit_code)"
              return 0
            fi

            if grep -q "falsified" "$outfile" || grep -q "analysis incomplete" "$outfile"; then
              echo "✅ $label behaved as expected"
              return 0
            fi

            echo "❌ $label PASSED unexpectedly — harness may be broken"
            return 1
          }

          run_tamarin_model() {
            local model="$1"
            local description="$2"
            local blocking="${3:-nonblocking}"
            local extra_flags="${4:-}"
            local outfile="tamarin_ext_${model%.spthy}.txt"

            echo ""
            echo "--- $description ---"
            set +e
            # --memory=6g --cpus=2 mirrors the shard 1 hardening in 6aa5b8e.
            # Without the cap, Tamarin can starve the GitHub runner of memory
            # and trigger "lost communication with the server" failures
            # without leaving any diagnostic output (observed on shards 1/3
            # in run 25287479059).
            timeout 1800 docker run --rm --memory=6g --cpus=2 meow-tamarin sh -c \
              "tamarin-prover $extra_flags --prove /formal/tamarin/$model" \
              2>&1 | tee "$outfile"
            local exit_code=$?
            set -e

            if [ "$exit_code" -eq 124 ]; then
              if [ "$blocking" = "blocking" ]; then
                echo "❌ $model timed out (30 min) — blocking model must complete"
                EXTENDED_FAILED=$((EXTENDED_FAILED + 1))
              else
                echo "⚠️  $model timed out (30 min) — treated as inconclusive"
              fi
            elif grep -q "falsified" "$outfile"; then
              echo "❌ $model: lemma FALSIFIED — security property violated"
              EXTENDED_FAILED=$((EXTENDED_FAILED + 1))
            elif grep -q "verified" "$outfile"; then
              verified_count=$(grep -c "verified" "$outfile" || echo "?")
              echo "✅ $model: $verified_count lemma(s) verified"
            else
              if [ "$blocking" = "blocking" ]; then
                echo "❌ $model: analysis incomplete — blocking model must verify"
                EXTENDED_FAILED=$((EXTENDED_FAILED + 1))
              else
                echo "⚠️  $model: analysis incomplete — inconclusive"
              fi
            fi
          }

          EXTENDED_FAILED=0

          case "${{ matrix.shard_id }}" in
            1)
              echo "============================================"
              echo "🟣 Tamarin shard 1/3 — core protocol proofs"
              echo "============================================"
              # Cap wall-time and memory: prior runs lost runner heartbeat
              # at ~1h6m with no per-step timeout, taking down the whole job
              # without diagnostics. 30 min timeout + 6 GiB memory ceiling
              # forces a clean exit instead of a runner blackout.
              timeout 1800 docker run --rm --memory=6g --cpus=2 meow-tamarin 2>&1 | tee tamarin_output.txt
              shard1_exit=$?
              if [ "$shard1_exit" -eq 124 ]; then
                echo "⚠️  Shard 1 core proofs timed out (30 min) — treating as inconclusive (non-blocking)"
              elif [ "$shard1_exit" -ne 0 ]; then
                echo "❌ Shard 1 core proofs exited $shard1_exit"
                EXTENDED_FAILED=$((EXTENDED_FAILED + 1))
              fi

              echo ""
              echo "============================================"
              echo "🔵 Tamarin AEAD binding — 4-ary encrypt with AAD"
              echo "============================================"
              # --memory=6g --cpus=2 keeps the runner alive when this and
              # the negative tests below run after the memory-capped main
              # shard 1 entrypoint has already used heap headroom.
              timeout 1800 docker run --rm --memory=6g --cpus=2 meow-tamarin sh -c \
                "tamarin-prover --prove /formal/tamarin/MeowAEADBinding.spthy" \
                2>&1 | tee tamarin_aead.txt
              if grep -q "verified" tamarin_aead.txt; then
                echo "✅ AEAD binding lemmas verified"
              elif grep -q "falsified" tamarin_aead.txt; then
                echo "❌ AEAD binding lemma FALSIFIED — security property violated"
                exit 1
              else
                echo "⚠️  Tamarin analysis incomplete (timeout/no-lemma) — treating as pass"
              fi

              echo ""
              echo "============================================"
              echo "🔴 Tamarin PQ NEGATIVE tests (should FAIL)"
              echo "============================================"
              run_negative_test \
                "Test 1: KEM ct not bound to HMAC" \
                tamarin_neg1.txt \
                "tamarin-prover --prove /formal/tamarin/MeowDuressEquivPQ_NEGATIVE_NoKEMBinding.spthy"
              run_negative_test \
                "Test 2: Non-uniform failure observables" \
                tamarin_neg2.txt \
                "tamarin-prover --diff /formal/tamarin/MeowDuressEquivPQ_NEGATIVE_LeaksFailureReason.spthy --prove"

              # Promoted nonblocking → blocking 2026-05-04 after the OOM
              # root cause was fixed locally (verified with Tamarin 1.12.0
              # + Maude 3.5.1):
              #   - 2 wellformedness bugs (unguarded `ct` in
              #     disable_prevents_decoy lemma; undeducible `current_time`
              #     in Trigger_OnDeadline rule — Tamarin's derivation check
              #     flagged it, and the rule never fired in practice)
              #   - 1 lemma typo (`Renew(_, 't1')` literal string `'t1'`
              #     never matched the Renew action's `current_tick` term)
              #   - Self-loop saturation anti-pattern in Check_Time rule
              #     (consumed State_Armed and re-emitted it unchanged)
              # The renewal_prevents_trigger lemma is commented out with
              # detailed rationale — proving it requires a sources/oracle
              # script that needs cryptographer review. The remaining 8
              # lemmas verify in ~1.3s total locally. See FOLLOWUP.md +
              # the model file for the full root-cause + fix narrative.
              run_tamarin_model "meow_deadmans_switch.spthy" "Dead man's switch duress protocol" blocking
              ;;
            2)
              echo "============================================"
              echo "🟣 Tamarin shard 2/3 — critical models A"
              echo "============================================"
              # Schrödinger deniability models are non-blocking pending
              # cryptographer review of the recent lemma rewrites
              # Promoted nonblocking → blocking 2026-05-04. Both Core
              # (10 lemmas) and Ratchet (4 lemmas after one was commented
              # out as model-mismatch) verify locally in < 25 s combined.
              # Fixes:
              #   - 8 unbound-variable bugs (let block referenced
              #     unprefixed `pw_a` etc. while premises declared
              #     `Fr(~pw_a)` — Tamarin treats them as distinct terms)
              #   - 2 circular-AAD bugs (aad_a referenced h(pt_a),
              #     pt_a needed aead_dec(_, aad_a))
              #   - EntropyGate restriction tightened from `Ex #t2`
              #     existential to same-time co-occurrence (was the
              #     state-space-explosion root cause)
              #   - DecodeStream rules now structurally MAC-verify via
              #     `hmac(k_*, ...)` pattern in In(), rejecting
              #     adversary-forged inputs
              #   - 6 lemmas gained explicit "not coerced" guards
              #     (their original wording was vacuously true under
              #     the old broken rules — now they express the
              #     intended non-coercion semantic)
              # The Ratchet model's HeaderEncryptionConfidentiality
              # lemma is commented out — it tested a header-encryption
              # property the model doesn't implement; that property
              # belongs to the dedicated MeowRatchetHeaderOE.spthy.
              run_tamarin_model "MeowSchrodingerDeniability_Core.spthy" "Schrödinger deniability core (lemmas 1-10)" blocking
              run_tamarin_model "MeowSchrodingerDeniability_Ratchet.spthy" "Schrödinger deniability ratchet (lemmas 11-15)" blocking
              run_tamarin_model "MeowKeyCommitment.spthy" "Key commitment / invisible salamanders" blocking
              ;;
            3)
              echo "============================================"
              echo "🟣 Tamarin shard 3/3 — critical models B + auxiliary"
              echo "============================================"
              run_tamarin_model "MeowRatchetFS.spthy" "Per-frame forward secrecy + PCS (ratchet)" blocking
              run_tamarin_model "MeowSchrodingerDeniabilityTiming.spthy" "Schrödinger deniability with timing channel (Gap-7 fix, lemmas T1-T5)" nonblocking
              run_tamarin_model "secure_alloc_guard_pages.spthy" "Guard page memory isolation proofs" nonblocking
              run_tamarin_model "MeowRatchetHeaderOE.spthy" "Ratchet header encryption OE (frame-index hiding)" nonblocking
              run_tamarin_model "MeowSchrodingerOE.spthy" "Schrödinger dual-password OE (simplified)" nonblocking
              run_tamarin_model "meow_encode_equiv.spthy" "Encoding observational equivalence (minimal)" nonblocking
              ;;
            *)
              echo "Unknown shard: ${{ matrix.shard_id }}"
              exit 1
              ;;
          esac

          if [ "$EXTENDED_FAILED" -gt 0 ]; then
            echo ""
            echo "❌ $EXTENDED_FAILED Tamarin model(s) failed (falsified lemma or blocking timeout)"
            exit 1
          fi

          echo ""
          echo "✅ Tamarin shard completed without blocking failures"

      - name: Upload Tamarin Results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: tamarin-results-${{ matrix.shard_key }}
          path: |
            tamarin_output.txt
            tamarin_aead.txt
            tamarin_neg1.txt
            tamarin_neg2.txt
            tamarin_ext_*.txt
          if-no-files-found: ignore
          retention-days: 30

  verus:
    name: Verus Structural Regression Check (NOT Z3)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build Verus Docker image
        run: docker build -f formal/Dockerfile.verus -t meow-verus .

      - name: Run Verus structural regression check
        run: |
          echo "============================================"
          echo "🔍 Verus Structural Regression Check"
          echo "   (counts proof fn / spec fn — does NOT invoke Z3)"
          echo "============================================"
          docker run --rm meow-verus 2>&1 | tee verus_output.txt

          if grep -q "structural inventory:: proof_spec_fn_count:" verus_output.txt; then
            COUNT=$(grep "structural inventory" verus_output.txt | grep -oP 'proof_spec_fn_count: \K\d+')
            echo "Proof/spec fn declarations found: $COUNT"
            if [ "$COUNT" -lt 1 ]; then
              echo "❌ Regression: Verus proof blocks appear to have been deleted"
              exit 1
            fi
            echo "✅ Structural regression check passed ($COUNT declarations)"
          else
            echo "❌ Could not parse structural check output"
            exit 1
          fi

      - name: Upload Verus Results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: verus-results
          path: verus_output.txt
          retention-days: 30

  constant-time-stats:
    name: Dudect Statistical Constant-Time (RL-2 empirical)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            crypto_core/target
          key: ${{ runner.os }}-cargo-ct-${{ hashFiles('crypto_core/Cargo.lock') }}

      - name: Run constant-time statistical benchmarks
        run: |
          cd crypto_core
          echo "============================================"
          echo "📊 Running dudect-style constant-time benchmarks"
          echo "   (RL-2 empirical mitigation — not a formal proof)"
          echo "============================================"
          echo ""
          # Run with --test flag to execute the measurement loop without
          # the full criterion HTML report overhead.
          cargo bench --bench constant_time 2>&1 | tee ct_bench_output.txt

          # Check for TIMING_LEAK_WARNING lines emitted by the bench.
          if grep -q "TIMING_LEAK_WARNING" ct_bench_output.txt; then
            echo ""
            echo "⚠️  Potential timing difference detected — see artifact for details."
            echo "    This is a WARNING, not a hard failure.  Timing jitter on shared"
            echo "    CI infrastructure can produce false positives.  Investigate if"
            echo "    |t| is consistently > 4.5 across multiple runs."
          else
            echo ""
            echo "✅ No statistically significant timing difference detected"
          fi

          # Always exit 0 (warning-only) unless MEOW_CT_STRICT=1
          exit 0

      - name: Upload timing results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: constant-time-stats
          path: crypto_core/ct_bench_output.txt
          retention-days: 30

  # Summary job to provide unified status
  verification-summary:
    name: Verification Summary
    needs: [proverif, tlaplus, lean, tamarin, verus, constant-time-stats]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: always()

    steps:
      - name: Check results
        run: |
          echo "============================================"
          echo "📋 Formal Verification Summary"
          echo "============================================"
          echo ""

          PROVERIF_STATUS="${{ needs.proverif.result }}"
          TLAPLUS_STATUS="${{ needs.tlaplus.result }}"
          LEAN_STATUS="${{ needs.lean.result }}"
          TAMARIN_STATUS="${{ needs.tamarin.result }}"
          VERUS_STATUS="${{ needs.verus.result }}"
          CT_STATUS="${{ needs.constant-time-stats.result }}"

          echo "ProVerif:       $PROVERIF_STATUS"
          echo "TLA+:           $TLAPLUS_STATUS"
          echo "Lean 4:         $LEAN_STATUS"
          echo "Tamarin:        $TAMARIN_STATUS"
          echo "Verus:          $VERUS_STATUS"
          echo "CT-Stats:       $CT_STATUS  (warning-only, RL-2 empirical)"
          echo ""

          ALL_PASS=true
          for STATUS in "$PROVERIF_STATUS" "$TLAPLUS_STATUS" "$LEAN_STATUS" "$TAMARIN_STATUS" "$VERUS_STATUS"; do
            if [ "$STATUS" != "success" ]; then
              ALL_PASS=false
            fi
          done
          # CT_STATUS is warning-only (see constant-time-stats job); do not gate on it.

          if [ "$ALL_PASS" = "true" ]; then
            echo "✅ All formal verification passed!"
          else
            echo "⚠️  Some verification tasks failed (non-blocking — aspirational provers)"
          fi
          # Formal verification is aspirational: tools (Tamarin/Verus/Lean) require
          # heavy infra and often flake. Report results but never fail the workflow.
          exit 0
