name: Deploy to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    name: "Build WASM & Prepare Pages"
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Cache Rust dependencies
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: wasm-${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: wasm-${{ runner.os }}-cargo-

      - name: Install wasm-pack
        run: cargo install wasm-pack --locked

      - name: Build WASM module
        run: |
          cd crypto_core
          wasm-pack build --target web --release --features wasm-pq
          echo "✅ WASM build complete"
          ls -la pkg/

      - name: Copy WASM artifacts to examples/
        run: |
          cp crypto_core/pkg/crypto_core.js examples/
          cp crypto_core/pkg/crypto_core_bg.wasm examples/

      - name: Prepare Pages site
        run: |
          mkdir -p _site
          # Copy root index.html
          cp index.html _site/
          # Copy web demo and examples
          cp -r examples/ _site/examples/
          cp -r web_demo/ _site/web_demo/
          cp -r assets/ _site/assets/ 2>/dev/null || true
          # Copy WASM pkg for any direct references
          mkdir -p _site/crypto_core/pkg
          cp crypto_core/pkg/crypto_core.js _site/crypto_core/pkg/
          cp crypto_core/pkg/crypto_core_bg.wasm _site/crypto_core/pkg/
          cp crypto_core/pkg/crypto_core.d.ts _site/crypto_core/pkg/ 2>/dev/null || true
          # Copy root-level docs
          cp README.md _site/ 2>/dev/null || true
          cp QUICKSTART.md _site/ 2>/dev/null || true
          echo "✅ Pages site prepared"
          find _site -name "*.js" -o -name "*.wasm" -o -name "*.html" | head -30

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    name: "Deploy to GitHub Pages"
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
