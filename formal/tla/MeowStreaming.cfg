\* MeowStreaming.cfg — TLA+ model configuration
\* Models AES-256-CTR streaming encryption with Encrypt-then-MAC

SPECIFICATION Spec

\* Small constants for bounded model checking (keeps state space manageable)
CONSTANTS
    MAX_CHUNKS = 3
    MAX_SESSIONS = 3
    MAX_CTR = 10
    NUM_KEYS = 2

\* Safety invariants
INVARIANT TypeOK
INVARIANT NonceUniqueness
INVARIANT MACCoversAllChunks
INVARIANT DomainSeparation
INVARIANT EncryptThenMAC
INVARIANT CounterNoWrap
INVARIANT MACVerifyBeforeDecrypt
