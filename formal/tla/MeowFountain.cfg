\* TLA+ Configuration for MeowFountain
\* Run with: tlc MeowFountain.tla -config MeowFountain.cfg

\* Constants - Using small values for bounded model checking
\* Note: These values satisfy RedundancySufficiency: 4*2 - 4*2*0 = 8 >= 4
CONSTANTS
    K_BLOCKS = 4
    REDUNDANCY = 2          \* 2x = 200% (conservative for testing)
    MAX_LOSS_RATE = 0       \* 0 = no loss for initial check; increase for stress test
    BLOCK_SIZE = 8

\* Initial state
INIT FountainInit

\* Next state relation
NEXT FountainNext

\* Safety properties to check
INVARIANT TypeOK
INVARIANT FountainDecodeGuarantee
INVARIANT BeliefPropagationProgress
INVARIANT LossToleranceInvariant
INVARIANT RedundancySufficiency

\* Liveness (optional - enable for full check)
\* PROPERTIES
\*     EventuallyDecodes
