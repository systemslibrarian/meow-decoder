\* TLC Configuration for MeowRatchet.tla
\* ======================================
\*
\* Run with:
\*   tlc MeowRatchet.tla -config MeowRatchet.cfg
\*   java -jar tla2tools.jar -config MeowRatchet.cfg MeowRatchet.tla

SPECIFICATION
    Spec

CONSTANTS
    MAX_SKIP_KEYS = 10    \* Use small value for model checking (production: 2000)
    MAX_FRAMES = 6        \* Bound for state space
    BEACON_INTERVAL = 3   \* Inject beacon every N frames

INVARIANT
    Safety
    TypeOK
    SkipKeyCacheBound
    KeyUniqueness
    ZeroizedTerminal

\* Liveness properties removed: EventuallySteps requires stronger fairness
\* assumptions (SF on BeaconRekey) to prevent infinite beacon-only loops.
\* Safety invariants are the critical verification targets.

\* State space constraints to keep model checking tractable
CONSTRAINT
    StateConstraint

\* Symmetry (none — all ratchet state is ordered)

\* Check all states reachable
CHECK_DEADLOCK FALSE
