\* TLC Configuration for MeowRatchet.tla
\* ======================================
\*
\* Run with:
\*   tlc MeowRatchet.tla -config MeowRatchet.cfg
\*   java -jar tla2tools.jar -config MeowRatchet.cfg MeowRatchet.tla

SPECIFICATION
    Spec

CONSTANTS
    MAX_SKIP_KEYS = 20    \* Use small value for model checking (production: 2000)
    MAX_FRAMES = 10       \* Bound for state space
    BEACON_INTERVAL = 3   \* Inject beacon every N frames

INVARIANT
    Safety
    TypeOK
    SkipKeyCacheBound
    KeyUniqueness
    ZeroizedTerminal

PROPERTY
    EventuallySteps

\* State space constraints to keep model checking tractable
CONSTRAINT
    frame_index <= MAX_FRAMES /\
    Cardinality(skip_key_cache) <= MAX_SKIP_KEYS /\
    chain_key <= 1000000

\* Symmetry (none — all ratchet state is ordered)

\* Check all states reachable
CHECK_DEADLOCK FALSE
