\* TLC Configuration for MasterRatchet.tla
\* =========================================
\*
\* Run with:
\*   tlc MasterRatchet.tla -config MasterRatchet.cfg
\*   java -jar tla2tools.jar -config MasterRatchet.cfg MasterRatchet.tla

SPECIFICATION
    Spec

CONSTANTS
    MAX_SESSIONS = 5    \* Small bound for tractable model checking
    MAX_GEN = 10        \* Maximum generation to explore

INVARIANT
    Safety
    TypeOK
    SessionGenerationUnique
    WipeCompleteness
    SessionKeyUniqueness
    GenerationBound
    WipedNotReused

\* Liveness properties removed: CanCreateSession and WipeEventuallyPossible
\* require stronger fairness assumptions. Safety invariants are the critical
\* verification targets for the master ratchet.

\* State space constraint
CONSTRAINT
    StateConstraint

CHECK_DEADLOCK FALSE
