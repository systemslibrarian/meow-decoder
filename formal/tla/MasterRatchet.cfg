\* TLC Configuration for MasterRatchet.tla
\* =========================================
\*
\* Run with:
\*   tlc MasterRatchet.tla -config MasterRatchet.cfg
\*   java -jar tla2tools.jar -config MasterRatchet.cfg MasterRatchet.tla

SPECIFICATION
    Spec

CONSTANTS
    MAX_SESSIONS = 5    \* Small bound for tractable model checking
    MAX_GEN = 10        \* Maximum generation to explore

INVARIANT
    Safety
    TypeOK
    SessionGenerationUnique
    WipeCompleteness
    SessionKeyUniqueness
    GenerationBound
    WipedNotReused

PROPERTY
    CanCreateSession
    WipeEventuallyPossible

\* State space constraint
CONSTRAINT
    generation <= MAX_GEN /\
    Cardinality(active_sessions) <= MAX_SESSIONS /\
    master_key <= 10000000

CHECK_DEADLOCK FALSE
