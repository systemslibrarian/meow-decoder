# Project-wide Gradle settings.

# IDE (e.g. Android Studio) users:
# Gradle settings configured through the IDE *will override*
# any settings specified in this file.

# For more details on how to configure your build environment visit
# http://www.gradle.org/docs/current/userguide/build_environment.html

# Specifies the JVM arguments used for the daemon process.
# The setting is particularly useful for tweaking memory settings.
org.gradle.jvmargs=-Xmx3072m -XX:MaxMetaspaceSize=768m -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8

# Reduce memory pressure on resource-constrained build hosts (e.g. Codespaces).
# Run Kotlin/Java compilers in-process inside the Gradle daemon rather than
# spawning per-module daemons that each reserve their own ~500 MB heap.
kotlin.compiler.execution.strategy=in-process
org.gradle.parallel=false
org.gradle.workers.max=1
org.gradle.configureondemand=true

# Use AndroidX
android.useAndroidX=true

# Automatically convert third-party libraries to use AndroidX
android.enableJetifier=true

# Use Hermes JS engine (recommended for React Native 0.73+)
hermesEnabled=true

# Use the new architecture (Fabric + TurboModules)
newArchEnabled=false

# Suppress Kotlin version compatibility warning
kotlin.jvm.target.validation.mode=warning
